<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벨트 위의 박자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: a portrait game screen. A 9:16 stage with an ㄹ-shaped belt down its middle, and one rubber touch pad below it split into left and right hands. One committed look: a warehouse at 3am under fluorescent tubes. */
:root{
  --night:#0a0807;
  --panel:#1f1915;
  --line:#3a2f28;
  --ink:#efe6d2;
  --muted:#a6978a;
  --paper:#efe6d2;
  --paper-ink:#1d1815;
  --paper-muted:#6d6156;
  --vest:#f07a2a;
  --vest-dark:#9c4512;
  --lime:#cfe04a;
  --tube:#ffe9a8;
  --ok:#8fd694;
  --laser:#ff5a4a;
  --stamp:#c8372d;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{box-sizing:border-box;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.page{--pad:clamp(96px,17dvh,150px);width:min(100%,480px,calc((100dvh - var(--pad) - 32px) * 9 / 16));display:flex;flex-direction:column;gap:8px}

.stage{position:relative;width:100%;aspect-ratio:9/16;max-width:100%;container-type:inline-size;overflow:hidden;border-radius:6px;background:#0d0a09;
  box-shadow:0 0 0 1px #000,0 0 40px rgba(0,0,0,.6);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}

/* touch pad: one rubber pad with a seam down the middle. Left half is the left hand, right half the right hand. */
.pad{position:relative;box-sizing:border-box;height:var(--pad);display:grid;grid-template-columns:1fr 1fr;border-radius:20px;overflow:hidden;
  background:#1a1714 repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px);
  box-shadow:inset 0 2px 0 #2d2824,inset 0 -4px 0 #0c0a09,0 6px 18px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.pad::after{content:"";position:absolute;left:50%;top:16%;bottom:16%;width:2px;margin-left:-1px;background:#0b0908;box-shadow:1px 0 0 #2e2925;border-radius:2px}
.half{--c:var(--vest);--glow:rgba(240,122,42,.42);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;
  color:#bfb3a5;transition:color .08s}
.half.right{--c:var(--lime);--glow:rgba(207,224,74,.38)}
.half::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),var(--glow),transparent 62%);opacity:0;transition:opacity .12s}
.half::after{content:"";position:absolute;bottom:12%;left:32%;right:32%;height:3px;border-radius:2px;background:var(--c);opacity:.28;transition:opacity .08s,box-shadow .08s}
.half.on{color:var(--ink)}
.half.on::before{opacity:1;transition:none}
.half.on::after{opacity:1;box-shadow:0 0 10px var(--c)}
.half .lamp{position:relative;width:9px;height:9px;border-radius:50%;background:#3a2f27;box-shadow:inset 0 1px 1px rgba(0,0,0,.7)}
.half.on .lamp{background:var(--c);box-shadow:0 0 8px var(--c)}
.half .lbl{position:relative;font-family:var(--display);font-size:clamp(17px,3dvh,24px);line-height:1}
.half .sub{position:relative;font-family:var(--mono);font-size:clamp(10px,1.6dvh,12px);letter-spacing:.06em;color:var(--muted);min-height:1.3em;display:flex;align-items:center;gap:.4em}
.half .sub i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c)}
.half .k{position:absolute;top:10px;font-family:var(--mono);font-size:11px;color:#5d534a;letter-spacing:.1em}
.half.left .k{left:16px} .half.right .k{right:16px}

.hud{position:absolute;top:2.4cqw;left:2.8cqw;right:2.8cqw;display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);
  font-size:clamp(10px,3.1cqw,14px);line-height:1.3;letter-spacing:.04em;color:var(--ink);pointer-events:none;font-variant-numeric:tabular-nums}
.hud span{display:inline-block;background:rgba(13,10,9,.66);padding:.18em .6em;border-radius:3px;transition:background-color .2s,color .2s}
.hud span.hot{background:var(--vest);color:#1b120c}
.hud span.pulse{animation:pulse .35s ease-out}
.hud span.broke{animation:broke .5s ease-out}
@keyframes broke{0%{background:var(--laser);color:#1b120c;transform:translateX(-4px)}15%{transform:translateX(4px)}30%{transform:translateX(-3px)}45%{transform:translateX(2px)}70%{background:var(--laser);color:#1b120c}100%{transform:none}}
@keyframes pulse{0%{transform:scale(1.3)}100%{transform:scale(1)}}

.bubble{position:absolute;left:3cqw;bottom:76%;max-width:64cqw;background:var(--paper);color:var(--paper-ink);font-weight:600;
  font-size:clamp(11px,3.6cqw,16px);line-height:1.35;padding:.45em .75em;border-radius:6px;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.bubble::after{content:"";position:absolute;left:var(--tail,1.4em);bottom:-.45em;border:.5em solid transparent;border-top-color:var(--paper);border-bottom:0}

.judge{position:absolute;left:69.4%;top:47%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(18px,8cqw,38px);line-height:1;
  text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap;text-align:center;opacity:0}
.judge small{display:block;font-family:var(--mono);font-size:.36em;letter-spacing:.08em;margin-top:.35em;color:var(--ink)}
.judge.perfect{color:var(--ok)} .judge.good{color:var(--tube)} .judge.miss{color:var(--laser)}
.judge.pop{animation:pop .55s ease-out forwards}
.judge.miss.pop{animation:popmiss .7s ease-out forwards}
@keyframes popmiss{0%{opacity:1;transform:translate(-50%,0) rotate(-7deg) scale(1.2)}12%{transform:translate(calc(-50% + 5px),0) rotate(5deg)}24%{transform:translate(calc(-50% - 4px),0) rotate(-3deg)}36%{transform:translate(-50%,0) rotate(0)}70%{opacity:1;transform:translate(-50%,12%)}100%{opacity:0;transform:translate(-50%,45%)}}
@keyframes pop{0%{opacity:1;transform:translate(-50%,12%) scale(1.25)}20%{transform:translate(-50%,0) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-35%)}}

.hint{position:absolute;left:50%;top:94%;transform:translateX(-50%);font-family:var(--mono);font-size:clamp(10px,3.1cqw,14px);
  background:var(--vest);color:#1b120c;padding:.2em .7em;border-radius:3px;pointer-events:none;white-space:nowrap}

.dialog{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;background:rgba(17,13,11,.95);border:1px solid var(--line);border-radius:6px;
  padding:3cqw 4cqw 6cqw;min-height:24cqw}
.dialog .who{display:inline-block;font-family:var(--display);font-size:clamp(12px,3.7cqw,16px);background:var(--vest);color:#1b120c;
  padding:.05em .55em;border-radius:3px;margin-bottom:.4em}
.dialog .text{font-size:clamp(13px,4.3cqw,19px);line-height:1.55;margin:0;min-height:1.5em}
.dialog .text.narr{color:#cfc3b4}
.dialog .next{position:absolute;right:4cqw;bottom:2.2cqw;font-family:var(--mono);font-size:clamp(10px,2.8cqw,12px);color:var(--muted);animation:blink 1s steps(2) infinite}
.dialog .skip{position:absolute;top:2.4cqw;right:3cqw;font-family:var(--mono);font-size:clamp(10px,2.8cqw,12px);background:transparent;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:.2em .6em;cursor:pointer}
.dialog .skip:focus-visible{outline:2px solid var(--tube);outline-offset:2px}
@keyframes blink{50%{opacity:0}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,7,.55);padding:4cqw}
.label{box-sizing:border-box;width:min(100%,90cqw);max-height:100%;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:4px;
  box-shadow:0 2cqw 0 rgba(0,0,0,.4);padding:4cqw 5cqw 4.5cqw;position:relative;transform:rotate(-1.5deg);cursor:default}
.label .bar{height:4cqw;min-height:10px;margin-bottom:2.4cqw;
  background:repeating-linear-gradient(90deg,var(--paper-ink) 0 2px,transparent 2px 4px,var(--paper-ink) 4px 5px,transparent 5px 8px,var(--paper-ink) 8px 11px,transparent 11px 13px,var(--paper-ink) 13px 14px,transparent 14px 17px)}
.label .kicker{font-family:var(--mono);font-size:clamp(9px,2.8cqw,12px);letter-spacing:.1em;display:flex;justify-content:space-between;gap:8px;
  border-bottom:2px solid var(--paper-ink);padding-bottom:.35em}
.label h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,11cqw,48px);line-height:1.02;margin:.32em 0 .22em;text-wrap:balance}
.label p{margin:0;font-size:clamp(12px,3.8cqw,16px);line-height:1.5}
.label .row{display:flex;flex-wrap:wrap;align-items:center;gap:3cqw;margin-top:3.5cqw}
.sync{display:inline-flex;align-items:center;gap:.4em;margin-left:auto;font-family:var(--mono);font-size:clamp(10px,3cqw,13px);color:var(--paper-muted)}
.sync button{width:2.2em;height:2.2em;border-radius:3px;border:1px solid var(--paper-muted);background:transparent;color:var(--paper-ink);font-size:inherit;cursor:pointer}
.sync button:focus-visible{outline:2px solid var(--vest);outline-offset:2px}
.sync output{min-width:6ch;text-align:center;font-variant-numeric:tabular-nums}
.btn{font-family:var(--display);font-size:clamp(14px,4.4cqw,20px);background:var(--vest);color:#1b120c;border:0;border-radius:3px;padding:.42em 1.1em;
  cursor:pointer;box-shadow:0 3px 0 var(--vest-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--vest-dark)}
.btn.ghost{background:transparent;color:var(--paper-ink);box-shadow:inset 0 0 0 2px var(--paper-ink)}
.btn:focus-visible{outline:3px solid var(--vest);outline-offset:3px}

.slip h2{font-size:clamp(22px,8.5cqw,38px)}
.slip dl{display:grid;grid-template-columns:auto 1fr;gap:.15em 1em;margin:.6em 0 0;font-size:clamp(11px,3.5cqw,15px);line-height:1.45}
.slip dt{font-family:var(--mono);color:var(--paper-muted);letter-spacing:.03em}
.slip dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.stamp{position:absolute;right:5cqw;top:13cqw;border:.7cqw solid var(--stamp);color:var(--stamp);font-family:var(--display);
  font-size:clamp(14px,6cqw,28px);padding:.12em .5em;border-radius:.3em;transform:rotate(-12deg);opacity:.88;pointer-events:none}

.board{box-sizing:border-box;width:min(100%,92cqw);max-height:100%;overflow:auto;background:#5b4330;border:3px solid #3a2a1e;border-radius:4px;box-shadow:0 2cqw 0 rgba(0,0,0,.45);
  padding:3.5cqw 3.5cqw 4cqw;cursor:default;color:var(--ink)}
.board-head{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:clamp(9px,2.8cqw,12px);letter-spacing:.1em;color:#e9dcc3;
  border-bottom:1px solid #8a6a4a;padding-bottom:.4em;margin-bottom:3cqw}
.cards{display:grid;grid-template-columns:1fr;gap:2.4cqw}
.card{position:relative;display:flex;gap:3cqw;align-items:center;text-align:left;background:var(--paper);color:var(--paper-ink);border:0;border-radius:3px;
  padding:2cqw 2.6cqw;cursor:pointer;box-shadow:0 .8cqw 0 rgba(0,0,0,.35);font-family:var(--body);min-width:0;transform:rotate(var(--tilt,0deg))}
.card:hover,.card:focus-visible{outline:3px solid var(--vest);outline-offset:1px}
.card canvas{width:12cqw;height:19cqw;flex:none;image-rendering:pixelated;background:#2a211c;border-radius:2px}
.card .info{min-width:0;display:flex;flex-direction:column;gap:.2em}
.card .name{font-family:var(--display);font-size:clamp(15px,5.2cqw,22px);line-height:1}
.card .role{font-family:var(--mono);font-size:clamp(9px,2.7cqw,12px);color:var(--paper-muted);letter-spacing:.03em}
.card .tag{display:inline-block;align-self:flex-start;font-family:var(--mono);font-size:clamp(9px,2.7cqw,12px);background:var(--paper-ink);color:var(--paper);
  padding:.05em .5em;border-radius:2px;margin-top:.2em}
.card .best{position:absolute;right:2.4cqw;top:50%;margin-top:-.8em;font-family:var(--display);font-size:clamp(11px,3.6cqw,16px);color:var(--stamp);border:.5cqw solid var(--stamp);
  padding:0 .35em;border-radius:.3em;transform:rotate(8deg);opacity:.85}

@media (prefers-reduced-motion: reduce){
  .judge.pop{animation:fade .6s forwards} .dialog .next{animation:none} .hud span.pulse,.hud span.broke{animation:none} .judge.miss.pop{animation:fade .7s forwards}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
}
</style>
</head>
<body>

<div class="page">
  <div class="stage" id="stage">
    <canvas id="cv" width="216" height="384" aria-label="ㄹ자 컨베이어 벨트 작업 화면"></canvas>
    <div class="hud" id="hud" hidden><span id="clock">B동 3번 라인 · 03:12</span><span id="combo">콤보 0</span></div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="judge" id="judge"></div>
    <div class="hint" id="hint" hidden></div>

    <div class="dialog" id="dialog" hidden>
      <span class="who" id="who"></span>
      <p class="text" id="dtext"></p>
      <span class="next">▼ 터치</span>
      <button class="skip" id="skip" type="button">건너뛰기</button>
    </div>

    <div class="overlay" id="title">
      <div class="label">
        <div class="bar"></div>
        <div class="kicker"><span>작업지시서 · 야간조</span><span>No. 0312-3B</span></div>
        <h2>벨트 위의 박자</h2>
        <p>옆 사람이 상자를 벨트에 올립니다. 벨트가 한 바퀴 도는 데 딱 한 마디. 상자가 빨간 선에 닿는 순간 터치하세요.</p>
        <div class="row">
          <button class="btn" id="start" type="button">출근하기</button>
          <span class="sync">싱크 <button id="sync-minus" type="button" aria-label="보정값 낮추기">−</button><output id="sync-val">0 ms</output><button id="sync-plus" type="button" aria-label="보정값 높이기">+</button></span>
        </div>
      </div>
    </div>

    <div class="overlay" id="select" hidden>
      <div class="board">
        <div class="board-head"><span>출근부 · 3번 라인</span><span>오늘 밤 페어</span></div>
        <div class="cards" id="cards"></div>
      </div>
    </div>

    <div class="overlay" id="result" hidden>
      <div class="label slip">
        <div class="bar"></div>
        <div class="kicker"><span>근무 확인서</span><span id="r-no">B03-0312-0001</span></div>
        <h2 id="r-title">첫 야간 근무</h2>
        <div class="stamp" id="r-stamp">정상 처리</div>
        <dl>
          <dt>보내는 분</dt><dd id="r-from">반장 · 3번 라인</dd>
          <dt>받는 분</dt><dd>신입 (나)</dd>
          <dt>처리 내역</dt><dd id="r-counts">딱 0 · 좋아 0 · 놓침 0</dd>
          <dt>최대 콤보</dt><dd id="r-combo">0</dd>
          <dt id="r-special-k">늦은 상자</dt><dd id="r-special">0 / 3 받아냄</dd>
          <dt>정확도</dt><dd id="r-acc">0%</dd>
        </dl>
        <div class="row">
          <button class="btn" id="retry" type="button">다시 하기</button>
          <button class="btn ghost" id="again" type="button">대화부터</button>
          <button class="btn ghost" id="board" type="button">출근부</button>
        </div>
      </div>
    </div>
  </div>

  <div class="pad" id="pad" role="group" aria-label="터치 패드: 왼쪽은 왼손, 오른쪽은 오른손">
    <div class="half left" id="halfL"><span class="k">F</span><span class="lamp"></span><span class="lbl">왼손</span><span class="sub" id="subL"></span></div>
    <div class="half right" id="halfR"><span class="k">J</span><span class="lamp"></span><span class="lbl">오른손</span><span class="sub" id="subR"></span></div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- constants ----------
const W = 216, H = 384, BAR_BEATS = 4;
const BOSS_X = 22, SCAN_X = 150;
const WIN_P = 0.05, WIN_G = 0.10, WIN_M = 0.16;
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => p < 0 ? 0 : p > 1 ? 1 : p * p * (3 - 2 * p);
const inRange = (b, ranges) => !!ranges && ranges.some(([a, z]) => b >= a && b < z);

const C = {
  kraft:'#c48b52', kraftTop:'#e0ae72', kraftDark:'#8f6236', tape:'#e6c88f', label:'#efe6d2', ink:'#1b1716',
  vest:'#f07a2a', reflect:'#ebe5c9', shirt:'#6b7073', cap:'#2c3b57', skin:'#d9a27a', skinDark:'#b98260', hair:'#9a948e',
  laser:'#ff4a3d', ok:'#8fd694', hoodie:'#2f4f58', vest2:'#cfe04a', hairDark:'#1e1a1a', crate:'#b48a5c', red:'#d8463b',
  belt:'#38302c', slat:'#2a2320', face:'#171312', metal:'#6a7075', sweat:'#9fd0ff', lime:'#cfe04a'
};

// ---------- the ㄹ belt ----------
// Three runs joined by two U-turns, centred on the screen. One trip from the start to the scanner takes one bar,
// so whatever rhythm the partner lays down comes back to you exactly a bar later.
const PX0 = 40, PX1 = 176, PR = 28, PY1 = 150, PY2 = PY1 + 2 * PR, PY3 = PY2 + 2 * PR, PEND = 206;
const SEG = [
  { k:'line', x0:PX0, y0:PY1, x1:PX1, y1:PY1 },
  { k:'arc', cx:PX1, cy:PY1 + PR, a0:-Math.PI / 2, dir:1 },
  { k:'line', x0:PX1, y0:PY2, x1:PX0, y1:PY2 },
  { k:'arc', cx:PX0, cy:PY2 + PR, a0:-Math.PI / 2, dir:-1 },
  { k:'line', x0:PX0, y0:PY3, x1:PEND, y1:PY3 }
];
SEG.forEach(sg => { sg.len = sg.k === 'line' ? Math.hypot(sg.x1 - sg.x0, sg.y1 - sg.y0) : Math.PI * PR; });
const PATH_LEN = SEG.reduce((a, sg) => a + sg.len, 0);
const SCAN_S = PATH_LEN - (PEND - SCAN_X), BOX_S0 = 4;
function pathAt(s) {
  if (s < 0) { const sg = SEG[0]; return { x: sg.x0 + s, y: sg.y0, tx: 1, ty: 0 }; }
  for (const sg of SEG) {
    if (s <= sg.len) {
      if (sg.k === 'line') { const tx = (sg.x1 - sg.x0) / sg.len, ty = (sg.y1 - sg.y0) / sg.len; return { x: sg.x0 + tx * s, y: sg.y0 + ty * s, tx, ty }; }
      const a = sg.a0 + sg.dir * s / PR;
      return { x: sg.cx + PR * Math.cos(a), y: sg.cy + PR * Math.sin(a), tx: -Math.sin(a) * sg.dir, ty: Math.cos(a) * sg.dir };
    }
    s -= sg.len;
  }
  const sg = SEG[SEG.length - 1]; return { x: sg.x1 + s, y: sg.y1, tx: 1, ty: 0 };
}
// lanes keep their side relative to the direction of travel, like a real two-lane belt
function lanePt(s, d) { const p = pathAt(s); return { x: p.x - p.ty * d, y: p.y + p.tx * d, tx: p.tx, ty: p.ty }; }
const BELT_PATH = (() => {

  const pose = { hand: idle, carry: null, wince: false, dip: 0, bob: 0, nod: 0, doze: false, phone: false, beat: 0, lane, ox };
  if (!active) { pose.bob = Math.sin(bt * 1.7 + lane) > 0.85 ? 1 : 0; return pose; }

  pose.beat = beat;

  pose.doze = inRange(beat, L.doze); pose.phone = inRange(beat, L.phone);
  if (pose.doze) pose.bob = 0;
  let cur = null;
  for (const n of notes) {
    if (n.lane !== lane) continue;
    if (n.late && t > n.place - SPB && t < n.place + 0.4 * SPB) { pose.wince = !pose.doze; pose.dip = 2; }
    if (n.place - n.carry <= t) cur = n;
  }
  if (!cur) return pose;
  const pp = lanePt(BOX_S0, laneD(lane));
  const push = { x: pp.x - 8, y: pp.y - 4 };
  if (t <= cur.place) {
    const p = (t - (cur.place - cur.carry)) / cur.carry;

    info.append(name, role, tag);
    b.append(c, info);
    if (progress[lv.id] != null) { const best = document.createElement('span'); best.className = 'best'; best.textContent = (progress[lv.id] * 100).toFixed(0) + '%'; b.append(best); }
    b.addEventListener('click', e => { e.stopPropagation(); beginShift(lv); });
    cardsEl.append(b);
    // portrait: the same partner drawing, offset into the small canvas
    const saved = g; g = c.getContext('2d'); g.fillStyle = '#2a211c'; g.fillRect(0, 0, 40, 64);
    const savedL = L; L = lv;
    lv.partners.forEach((pid, k) => {
      const P = PARTNERS[pid], n = lv.partners.length;
      g.save(); g.translate((n === 2 ? 11 + k * 18 : 20) - BOSS_X, 8 - P.base);
      const pose = { hand: { x: BOSS_X + 13, y: P.base + 44 }, carry: null, wince: false, dip: 0, bob: 0, nod: 0, doze: false, phone: false, lane: 0, ox: 0 };
      P.draw(pose, 0, false); P.arm(pose); g.restore();
    });
    L = savedL; g = saved;
  });
}
function openBoard() { ensureAudio(); state = 'select'; $('title').hidden = true; $('result').hidden = true; dialogEl.hidden = true; buildCards(); $('select').hidden = false; }

function beginShift(level) {
  ensureAudio(); loadLevel(level); resetRun(); handLabels();
  $('title').hidden = true; $('result').hidden = true; $('select').hidden = true; state = 'intro';
  runDialog(level.intro, startPlay);
}
function startPlay() {
  ensureAudio(); resetRun();
  $('title').hidden = true; $('result').hidden = true; $('select').hidden = true;
  events = buildEvents(); evI = 0; T0 = ctx.currentTime + 0.8;
  lastClock = ''; lastCombo = -1; lastSay = ''; lastHint = '';
  musF.frequency.cancelScheduledValues(ctx.currentTime); musF.frequency.setValueAtTime(20000, ctx.currentTime);
  hud.hidden = false; state = 'play'; startHum();
}
function accuracy() { return (stats.perfect + stats.good * 0.6 + stats.tailOk) / (notes.length + notes.filter(n => n.len).length); }
function finishPlay() {
  state = 'outro'; stopHum(); stopHold(); bubble.hidden = true; hint.hidden = true;
  const acc = accuracy();
  try { if ((progress[L.id] || 0) < acc) { progress[L.id] = acc; localStorage.setItem('belt.progress', JSON.stringify(progress)); } } catch (e) {}
  runDialog(L.outro(acc >= 0.8, stats.special), showResult);
}
let runNo = 0;
function showResult() {
  state = 'result'; hud.hidden = true; runNo++;
  const acc = accuracy();
  $('r-no').textContent = 'B03-' + L.clock.replace(':', '') + '-' + String(runNo).padStart(4, '0');
  $('r-title').textContent = L.title;
  $('r-from').textContent = `${L.who} · 3번 라인`;
  $('r-counts').textContent = `딱 ${stats.perfect} · 좋아 ${stats.good} · 놓침 ${stats.miss + stats.tailBroken}`;
  $('r-combo').textContent = stats.maxCombo;
  $('r-special-k').textContent = L.special[0];
  $('r-special').textContent = `${stats.special} / ${specialTotal()} ${L.special[2]}`;
  $('r-acc').textContent = (acc * 100).toFixed(1) + '%';
  $('r-stamp').textContent = acc >= 0.9 ? '완벽 페어' : acc >= 0.75 ? '정상 처리' : acc >= 0.5 ? '재확인' : '재작업';
  $('result').hidden = false;
  $('retry').focus({ preventScroll: true });
}
$('start').addEventListener('click', e => { e.stopPropagation(); openBoard(); });
$('retry').addEventListener('click', e => { e.stopPropagation(); startPlay(); });
$('again').addEventListener('click', e => { e.stopPropagation(); beginShift(L); });
$('board').addEventListener('click', e => { e.stopPropagation(); openBoard(); });

// ---------- input ----------
// held maps an input id (key code or pointer) to the lane it pressed. Left hand = F/D, left half of the pad or screen.
const held = new Map();
const LEFT_KEYS = new Set(['KeyF', 'KeyD']);
const KEYS = new Set(['Space', 'Enter', 'KeyJ', 'KeyF', 'KeyD', 'KeyK']);
const padEl = $('pad'), halves = { L: $('halfL'), R: $('halfR') };
let lastPressL = -1e9, lastPressR = -1e9;
function laneOf(side) { return L.lanes === 2 ? (side === 'L' ? 0 : 1) : 0; }
function handLabels() {
  const two = L.lanes === 2;
  $('subL').innerHTML = two ? `<i></i>${L.partners[0] === 'boss' ? '반장' : '왼쪽'}` : '';
  $('subR').innerHTML = two ? `<i></i>${L.partners[1] === 'jiwoo' ? '지우' : '오른쪽'}` : '';
}
function lightHalf(side, on, x, y) {
  const el = halves[side];
  if (x != null) { el.style.setProperty('--x', x + 'px'); el.style.setProperty('--y', y + 'px'); }
  el.classList.toggle('on', on);
}
function sideHeld(side) { for (const k of held.keys()) if (k.startsWith(side + ':')) return true; return false; }
function pressSide(ts, side, id) {
  const lane = laneOf(side);
  held.set(side + ':' + id, lane);
  if (side === 'L') lastPressL = performance.now(); else lastPressR = performance.now();
  if (state === 'play') onHit(ts, side, lane);
  else if (dlg) advanceDialog();
  else if (state === 'title') openBoard();
}
function releaseSide(ts, side, id) {
  const key = side + ':' + id, lane = held.get(key); if (lane == null) return;
  held.delete(key);
  if (!sideHeld(side)) lightHalf(side, false);
  if (state === 'play' && ![...held.values()].includes(lane)) onRelease(ts, lane);
}
const ptrSide = new Map();
padEl.addEventListener('pointerdown', e => {
  e.preventDefault(); try { padEl.setPointerCapture(e.pointerId); } catch (err) {}
  const r = padEl.getBoundingClientRect(), side = e.clientX - r.left < r.width / 2 ? 'L' : 'R';
  const hr = halves[side].getBoundingClientRect();
  ptrSide.set(e.pointerId, side); lightHalf(side, true, e.clientX - hr.left, e.clientY - hr.top);
  pressSide(e.timeStamp, side, 'p' + e.pointerId);
});
const padUp = e => { const side = ptrSide.get(e.pointerId); if (!side) return; ptrSide.delete(e.pointerId); releaseSide(e.timeStamp, side, 'p' + e.pointerId); };
padEl.addEventListener('pointerup', padUp); padEl.addEventListener('pointercancel', padUp);
addEventListener('keydown', e => {
  if (!KEYS.has(e.code)) return;
  const onButton = e.target instanceof Element && e.target.closest('button');
  if (state !== 'play' && onButton) return;
  e.preventDefault();
  if (e.repeat) return;
  const side = LEFT_KEYS.has(e.code) ? 'L' : 'R';
  lightHalf(side, true); pressSide(e.timeStamp, side, e.code);
});
addEventListener('keyup', e => { if (!KEYS.has(e.code)) return; releaseSide(e.timeStamp, LEFT_KEYS.has(e.code) ? 'L' : 'R', e.code); });
const stage = $('stage');
stage.addEventListener('pointerdown', e => {
  if (e.target instanceof Element && e.target.closest('button, .label, .board')) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect(), side = e.clientX - r.left < r.width / 2 ? 'L' : 'R';
  ptrSide.set(e.pointerId, side); lightHalf(side, true);
  pressSide(e.timeStamp, side, 'p' + e.pointerId);
});
addEventListener('pointerup', padUp); addEventListener('pointercancel', padUp);
addEventListener('blur', () => { for (const k of [...held.keys()]) { const [side, id] = k.split(':'); releaseSide(performance.now(), side, id); } ptrSide.clear(); });

// ---------- loop ----------
function frame(now) {
  requestAnimationFrame(frame);
  const active = state === 'play';
  const t = active ? songAt(now) : -99;
  if (active) {
    schedule(); judgeTick(t); updateHud(t);
    if (t > timeAt(END_BEAT)) finishPlay();
  }
  drawScene(t, now / 1000, active, now);
}
requestAnimationFrame(frame);
})();
</script>
</body>
