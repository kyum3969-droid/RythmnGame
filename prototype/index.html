<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벨트 위의 박자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: a landscape game screen. The 16:9 stage fills the viewport and you touch the screen itself: left half is the left hand, right half the right. One committed look: a warehouse at 3am under fluorescent tubes. */
:root{
  --night:#15110e;
  --panel:#1f1915;
  --line:#3a2f28;
  --ink:#efe6d2;
  --muted:#a6978a;
  --paper:#efe6d2;
  --paper-ink:#1d1815;
  --paper-muted:#6d6156;
  --vest:#f07a2a;
  --vest-dark:#9c4512;
  --tube:#ffe9a8;
  --ok:#8fd694;
  --laser:#ff5a4a;
  --stamp:#c8372d;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%} body{box-sizing:border-box;margin:0}
body{background:#0a0807;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.page{width:min(100%,calc((100dvh - 20px) * 16 / 9));max-width:100%;display:flex;flex-direction:column}

.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;border-radius:4px;background:#0d0a09;
  box-shadow:0 0 0 1px #000,0 0 40px rgba(0,0,0,.6);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}

.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}

/* touch feedback: a ring blooms where you touch */
.ripple{position:absolute;width:11cqw;height:11cqw;margin:-5.5cqw 0 0 -5.5cqw;border-radius:50%;border:2px solid rgba(255,233,168,.75);pointer-events:none;
  animation:rip .38s ease-out forwards}
.ripple.L{border-color:var(--vest);box-shadow:0 0 12px rgba(240,122,42,.5)}
.ripple.R{border-color:#cfe04a;box-shadow:0 0 12px rgba(207,224,74,.45)}
@keyframes rip{from{transform:scale(.25);opacity:1}to{transform:scale(1);opacity:0}}

.hud{position:absolute;top:1.6cqw;left:2.2cqw;right:2.2cqw;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);
  font-size:clamp(9px,1.5cqw,15px);line-height:1.3;letter-spacing:.06em;color:var(--ink);pointer-events:none;font-variant-numeric:tabular-nums}
.hud span{display:inline-block;background:rgba(13,10,9,.62);padding:.15em .6em;border-radius:3px;transition:background-color .2s,color .2s}
.hud span.hot{background:var(--vest);color:#1b120c}
.hud span.pulse{animation:pulse .35s ease-out}
.hud span.broke{animation:broke .5s ease-out}
@keyframes broke{0%{background:var(--laser);color:#1b120c;transform:translateX(-4px)}15%{transform:translateX(4px)}30%{transform:translateX(-3px)}45%{transform:translateX(2px)}70%{background:var(--laser);color:#1b120c}100%{transform:none}}
@keyframes pulse{0%{transform:scale(1.3)}100%{transform:scale(1)}}

.bubble{position:absolute;left:3cqw;bottom:61%;max-width:38cqw;background:var(--paper);color:var(--paper-ink);font-weight:600;
  font-size:clamp(11px,1.9cqw,18px);line-height:1.35;padding:.45em .75em;border-radius:6px;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.bubble::after{content:"";position:absolute;left:1.6em;bottom:-.45em;border:.5em solid transparent;border-top-color:var(--paper);border-bottom:0}
.bubble.robot{background:#1d2a30;color:#8fe3f0;font-family:var(--mono);font-weight:500;font-size:clamp(10px,1.6cqw,15px);border:1px solid #3d6b78}
.bubble.robot::after{border-top-color:#1d2a30}

.judge{position:absolute;left:78.1%;top:29%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(20px,5.4cqw,54px);line-height:1;
  text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap;text-align:center;opacity:0}
.judge small{display:block;font-family:var(--mono);font-size:.36em;letter-spacing:.1em;margin-top:.35em;color:var(--ink)}
.judge.perfect{color:var(--ok)} .judge.good{color:var(--tube)} .judge.miss{color:var(--laser)}
.judge.pop{animation:pop .55s ease-out forwards}
.judge.miss.pop{animation:popmiss .7s ease-out forwards}
@keyframes popmiss{0%{opacity:1;transform:translate(-50%,0) rotate(-7deg) scale(1.2)}12%{transform:translate(calc(-50% + 5px),0) rotate(5deg)}24%{transform:translate(calc(-50% - 4px),0) rotate(-3deg)}36%{transform:translate(-50%,0) rotate(0)}70%{opacity:1;transform:translate(-50%,12%)}100%{opacity:0;transform:translate(-50%,45%)}}
@keyframes pop{0%{opacity:1;transform:translate(-50%,16%) scale(1.6)}18%{transform:translate(-50%,0) scale(.95)}28%{transform:translate(-50%,0) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-35%)}}

.hint{position:absolute;left:78.1%;top:79%;transform:translateX(-50%);font-family:var(--mono);font-size:clamp(10px,1.6cqw,15px);
  background:var(--vest);color:#1b120c;padding:.2em .6em;border-radius:3px;pointer-events:none;white-space:nowrap}

.dialog{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;background:rgba(17,13,11,.95);border:1px solid var(--line);border-radius:6px;
  padding:1.4cqw 2.2cqw 1.8cqw;min-height:11cqw}
.dialog .who{display:inline-block;font-family:var(--display);font-size:clamp(11px,1.8cqw,17px);background:var(--vest);color:#1b120c;
  padding:.05em .55em;border-radius:3px;margin-bottom:.35em}
.dialog .who.robot{background:#3d6b78;color:#dff7fb;font-family:var(--mono)}
.dialog .text{font-size:clamp(12px,2.25cqw,22px);line-height:1.5;margin:0;min-height:1.5em}
.dialog .text.narr{color:#cfc3b4}
.dialog .text.robot{font-family:var(--mono);color:#8fe3f0;font-size:clamp(11px,1.9cqw,18px)}
.dialog .next{position:absolute;right:2.2cqw;bottom:1.2cqw;font-family:var(--mono);font-size:clamp(10px,1.4cqw,13px);color:var(--muted);animation:blink 1s steps(2) infinite}
.dialog .skip{position:absolute;top:1.1cqw;right:1.6cqw;font-family:var(--mono);font-size:clamp(10px,1.4cqw,13px);background:transparent;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:.2em .6em;cursor:pointer}
.dialog .skip:focus-visible{outline:2px solid var(--tube);outline-offset:2px}
@keyframes blink{50%{opacity:0}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,7,.5);padding:3cqw}
.label{width:min(100%,60cqw);max-height:100%;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:4px;
  box-shadow:0 1cqw 0 rgba(0,0,0,.4);padding:2cqw 2.6cqw 2.2cqw;position:relative;transform:rotate(-1.2deg);cursor:default}
.label .bar{height:2cqw;min-height:8px;margin-bottom:1.1cqw;
  background:repeating-linear-gradient(90deg,var(--paper-ink) 0 2px,transparent 2px 4px,var(--paper-ink) 4px 5px,transparent 5px 8px,var(--paper-ink) 8px 11px,transparent 11px 13px,var(--paper-ink) 13px 14px,transparent 14px 17px)}
.label .kicker{font-family:var(--mono);font-size:clamp(9px,1.35cqw,13px);letter-spacing:.12em;display:flex;justify-content:space-between;gap:8px;
  border-bottom:2px solid var(--paper-ink);padding-bottom:.35em}
.label h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,6cqw,58px);line-height:1;margin:.28em 0 .18em;text-wrap:balance}
.label p{margin:0;font-size:clamp(11px,1.85cqw,17px);line-height:1.45}
.label .row{display:flex;flex-wrap:wrap;align-items:center;gap:1.2cqw 1.6cqw;margin-top:1.5cqw}
.sync{display:inline-flex;align-items:center;gap:.4em;margin-left:auto;font-family:var(--mono);font-size:clamp(9px,1.3cqw,13px);color:var(--paper-muted)}
.sync button{width:2.2em;height:2.2em;border-radius:3px;border:1px solid var(--paper-muted);background:transparent;color:var(--paper-ink);font-size:inherit;cursor:pointer}
.sync button:focus-visible{outline:2px solid var(--vest);outline-offset:2px}
.sync output{min-width:6ch;text-align:center;font-variant-numeric:tabular-nums}
.btn{font-family:var(--display);font-size:clamp(13px,2.1cqw,20px);background:var(--vest);color:#1b120c;border:0;border-radius:3px;padding:.42em 1.1em;
  cursor:pointer;box-shadow:0 3px 0 var(--vest-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--vest-dark)}
.btn.ghost{background:transparent;color:var(--paper-ink);box-shadow:inset 0 0 0 2px var(--paper-ink)}
.btn:focus-visible{outline:3px solid var(--vest);outline-offset:3px}

.slip h2{font-size:clamp(18px,4cqw,40px)}
.slip dl{display:grid;grid-template-columns:auto 1fr;gap:.1em 1.2em;margin:.5em 0 0;font-size:clamp(10px,1.7cqw,16px);line-height:1.45}
.slip dt{font-family:var(--mono);color:var(--paper-muted);letter-spacing:.04em}
.slip dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.stamp{position:absolute;right:3cqw;top:6cqw;border:.35cqw solid var(--stamp);color:var(--stamp);font-family:var(--display);
  font-size:clamp(14px,3.2cqw,32px);padding:.12em .5em;border-radius:.3em;transform:rotate(-12deg);opacity:.88;pointer-events:none}

/* attendance board: who you work beside tonight */
.board{width:min(100%,84cqw);max-height:100%;overflow:auto;background:#5b4330;border:3px solid #3a2a1e;border-radius:4px;box-shadow:0 1cqw 0 rgba(0,0,0,.45);
  padding:1.6cqw 2cqw 1.8cqw;cursor:default;color:var(--ink)}
.board-head{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:clamp(9px,1.4cqw,14px);letter-spacing:.12em;color:#e9dcc3;
  border-bottom:1px solid #8a6a4a;padding-bottom:.4em;margin-bottom:1.2cqw}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2cqw}
.card{position:relative;display:flex;gap:1cqw;align-items:stretch;text-align:left;background:var(--paper);color:var(--paper-ink);border:0;border-radius:3px;
  padding:1cqw 1.1cqw;cursor:pointer;box-shadow:0 .4cqw 0 rgba(0,0,0,.35);font-family:var(--body);min-width:0;transform:rotate(var(--tilt,0deg))}
.card:hover,.card:focus-visible{outline:3px solid var(--vest);outline-offset:1px}
.card canvas{width:7cqw;height:11cqw;flex:none;image-rendering:pixelated;background:#2a211c;border-radius:2px}
.card .info{min-width:0;display:flex;flex-direction:column;gap:.15em}
.card .name{font-family:var(--display);font-size:clamp(13px,2.4cqw,24px);line-height:1}
.card .role{font-family:var(--mono);font-size:clamp(8px,1.15cqw,12px);color:var(--paper-muted);letter-spacing:.04em}
.card .tag{display:inline-block;align-self:flex-start;font-family:var(--mono);font-size:clamp(8px,1.15cqw,12px);background:var(--paper-ink);color:var(--paper);
  padding:.05em .5em;border-radius:2px;margin-top:.25em}
.card[disabled]{cursor:default;background:#cfc4ae;color:#5d534a}
.card[disabled] canvas{filter:grayscale(.6) brightness(.7)}
.card[disabled]:hover{outline:none}
.card .lock{position:absolute;right:.8cqw;bottom:.7cqw;font-family:var(--mono);font-size:clamp(8px,1.1cqw,11px);letter-spacing:.08em;color:#7a6c5e}
.card.boss{background:#2a2422;color:var(--ink)}
.card.boss .role{color:#b8a998} .card.boss .tag{background:var(--stamp);color:#fff}
.card.boss[disabled]{background:#2a2422;color:#cfc3b4}
.card .best{position:absolute;right:.8cqw;top:.6cqw;font-family:var(--display);font-size:clamp(9px,1.5cqw,15px);color:var(--stamp);border:.2cqw solid var(--stamp);
  padding:0 .35em;border-radius:.3em;transform:rotate(8deg);opacity:.85}
.board-foot{margin:1.2cqw 0 0;font-size:clamp(10px,1.5cqw,14px);color:#e9dcc3}

@media (prefers-reduced-motion: reduce){
  .judge.pop{animation:fade .6s forwards} .dialog .next{animation:none} .hud span.pulse,.hud span.broke{animation:none} .judge.miss.pop{animation:fade .7s forwards}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
}

</style>
</head>
<body>

<div class="page">
  <div class="stage" id="stage">
    <canvas id="cv" width="384" height="216" aria-label="컨베이어 벨트 작업 화면"></canvas>
    <div class="hud" id="hud" hidden><span id="clock">B동 3번 라인 · 03:12</span><span id="combo">콤보 0</span></div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="judge" id="judge"></div>
    <div class="hint" id="hint" hidden></div>

    <div class="dialog" id="dialog" hidden>
      <span class="who" id="who"></span>
      <p class="text" id="dtext"></p>
      <span class="next">▼ 터치</span>
      <button class="skip" id="skip" type="button">건너뛰기</button>
    </div>

    <div class="overlay" id="title">
      <div class="label">
        <div class="bar"></div>
        <div class="kicker"><span>작업지시서 · 야간조</span><span>No. 0312-3B</span></div>
        <h2>벨트 위의 박자</h2>
        <p>스테이지 1 · 첫 야간. 반장님이 상자를 벨트에 올립니다. 상자가 빨간 선에 닿는 순간 화면을 터치하세요.</p>
        <div class="row">
          <button class="btn" id="start" type="button">출근하기</button>
          <span class="sync">싱크 <button id="sync-minus" type="button" aria-label="보정값 낮추기">−</button><output id="sync-val">0 ms</output><button id="sync-plus" type="button" aria-label="보정값 높이기">+</button></span>
        </div>
      </div>
    </div>

    <div class="overlay" id="select" hidden>
      <div class="board">
        <div class="board-head"><span>스테이지 1 · 첫 야간</span><span>B동 3번 라인</span></div>
        <div class="cards" id="cards"></div>
      </div>
    </div>

    <div class="overlay" id="result" hidden>
      <div class="label slip">
        <div class="bar"></div>
        <div class="kicker"><span>근무 확인서</span><span id="r-no">B03-0312-0001</span></div>
        <h2 id="r-title">첫 야간 근무</h2>
        <div class="stamp" id="r-stamp">정상 처리</div>
        <dl>
          <dt>보내는 분</dt><dd id="r-from">반장 · 3번 라인</dd>
          <dt>받는 분</dt><dd>신입 (나)</dd>
          <dt>처리 내역</dt><dd id="r-counts">딱 0 · 좋아 0 · 놓침 0</dd>
          <dt>최대 콤보</dt><dd id="r-combo">0</dd>
          <dt id="r-special-k">늦은 상자</dt><dd id="r-special">0 / 3 받아냄</dd>
          <dt>정확도</dt><dd id="r-acc">0%</dd>
        </dl>
        <div class="row">
          <button class="btn" id="retry" type="button">다시 하기</button>
          <button class="btn ghost" id="again" type="button">대화부터</button>
          <button class="btn ghost" id="board" type="button">출근부로</button>
        </div>
      </div>
    </div>
  </div>

</div>

function startHum() {

  s.buffer = nbuf; s.loop = true; f.type = 'lowpass'; f.frequency.value = 170; gn.gain.value = 0.06;
  s.connect(f); f.connect(gn); gn.connect(bus); s.start(); hum = s;
}
function stopHum() { if (hum) { try { hum.stop(); } catch (e) {} hum = null; } }
function startHold() {
  stopHold(); holdOsc = ctx.createOscillator(); const gn = ctx.createGain();
  holdOsc.type = 'triangle'; holdOsc.frequency.value = 1320; gn.gain.value = 0.035; holdOsc.connect(gn); gn.connect(bus); holdOsc.start();
}
function stopHold() { if (holdOsc) { try { holdOsc.stop(); } catch (e) {} holdOsc = null; } }

function songAt(perfMs) {
  if (!ctx) return -99;
  if (ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (perfMs - ts.performanceTime) / 1000 - T0;
  }
  return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0) + (perfMs - performance.now()) / 1000 - T0;
}

// ---------- game state ----------
let state = 'title', stats = null, lastPress = -1e9, lastPressUpper = -1e9, lastGood = -1e9, lastHeavy = -1e9, heavyPend = null;
let offsetMs = 0;
try { offsetMs = parseInt(localStorage.getItem('belt.offset') || '0', 10) || 0; } catch (e) {}
const syncVal = $('sync-val');
const showSync = () => { syncVal.textContent = (offsetMs > 0 ? '+' : '') + offsetMs + ' ms'; };
const setSync = v => { offsetMs = Math.max(-200, Math.min(200, v)); showSync(); try { localStorage.setItem('belt.offset', String(offsetMs)); } catch (e) {} };
$('sync-minus').addEventListener('click', () => setSync(offsetMs - 10));
$('sync-plus').addEventListener('click', () => setSync(offsetMs + 10));
showSync();
let progress = {};
try { progress = JSON.parse(localStorage.getItem('belt.progress') || '{}') || {}; } catch (e) {}

function resetRun() {
  notes.forEach(n => { n.state = 'pending'; n.hitAt = null; n.judge = null; n.doneAt = null; n.binSfx = false; n.missKind = ''; });
  FX.particles = []; FX.marks = []; FX.react = [{ type: '', at: -1e9 }, { type: '', at: -1e9 }]; FX.lastMiss = -1e9; FX.missKind = ''; FX.missLane = 0; FX.goodLane = 0; FX.shakeUntil = -1e9; FX.playerNod = -1e9; FX.flinch = -1e9; FX.binHit = -1e9; FX.bossLine = null; FX.punchAt = -1e9;
  stats = { perfect: 0, good: 0, miss: 0, tailOk: 0, tailBroken: 0, combo: 0, maxCombo: 0, special: 0, missStreak: 0 };
  rings = []; heavyPend = null;
}
loadLevel(LEVELS[0]); resetRun();

const judgeEl = $('judge');
function popJudge(kind, sub = '', lane = 0) {
  const map = { perfect: ['딱!', 'perfect'], good: ['좋아', 'good'], miss: ['놓침', 'miss'], done: ['스캔 완료', 'perfect'], broken: ['깨짐', 'miss'] };
  const [txt, cls] = map[kind];
  judgeEl.className = 'judge ' + cls;
  judgeEl.style.top = L.lanes === 2 && lane === 0 ? '12%' : '29%';
  judgeEl.innerHTML = '';
  judgeEl.append(txt);
  if (sub) { const s = document.createElement('small'); s.textContent = sub; judgeEl.append(s); }
  void judgeEl.offsetWidth; judgeEl.classList.add('pop');
}
function ring(c, lane = 0) { rings.push({ at: performance.now(), c, dy: L.lanes === 2 ? LANE_DY[lane] : 0 }); }
function addCombo() {
  stats.combo++; stats.maxCombo = Math.max(stats.maxCombo, stats.combo);
  if (stats.combo % 10 === 0) {
    FX.playerNod = performance.now();
    comboEl.classList.remove('pulse'); void comboEl.offsetWidth; comboEl.classList.add('pulse');
    return stats.combo + ' 콤보';
  }
  return '';
}
function failFx(kind, judgeKind, sub, d, lane = 0) {
  const now = performance.now(), lost = stats.combo;
  stats.combo = 0; stats.missStreak++;
  popJudge(judgeKind, lost >= 10 ? lost + ' 콤보 끊김' : sub, lane);
  FX.lastMiss = now; FX.missKind = kind; FX.missLane = lane; FX.react[lane] = { type: 'glance', at: now }; FX.flinch = now;
  if (d != null) FX.marks.push({ d, at: now, c: C.laser });
  if (ctx) {
    if (kind === 'pass') errBeep(ctx.currentTime); else if (kind === 'broken') glass(ctx.currentTime); else buzz(ctx.currentTime);
    muffle();
    if (lost >= 10) comboBreak(ctx.currentTime + 0.06);
  }
  if (lost >= 10) { comboEl.classList.remove('pulse', 'broke'); void comboEl.offsetWidth; comboEl.classList.add('broke'); }
  if (stats.missStreak === 3) sayNow(L.comfort[0]);
  else if (stats.missStreak === 6) sayNow(L.comfort[1]);
}
function registerMiss(sub, d, kind, lane = 0) { stats.miss++; failFx(kind, 'miss', sub, d, lane); }
function sayNow(text) { FX.bossLine = { text, until: songAt(performance.now()) + 2.6 * SPB }; }

function isSpecial(n) {
  const [, kind, , range] = L.special;
  return kind === 'range' ? n.beat >= range[0] && n.beat < range[1] : !!n[kind];
}
function specialTotal() { return notes.filter(isSpecial).length; }

// closest pending note inside the window, so dense 16th charts never hand a press to the wrong box
function findTarget(t, lane) {
  let best = null, bd = Infinity;
  for (const n of notes) {
    if (n.state !== 'pending' || n.lane !== lane) continue;
    const d = t - n.arr;
    if (d > WIN_M) continue;
    if (d < -WIN_M) break;
    if (Math.abs(d) < bd) { bd = Math.abs(d); best = n; }
  }
  return best;
}
function judgeNote(target, t) {
  const d = t - target.arr, ad = Math.abs(d);
  target.hitAt = t;
  if (ad <= WIN_G) {
    const j = ad <= WIN_P ? 'perfect' : 'good', now = performance.now();
    target.judge = j; stats[j]++; stats.missStreak = 0;
    const milestone = addCombo();
    const tones = CHORDS[chordIdx(target.beat)];
    if (j === 'perfect') { const f = tones[stats.combo % 3] * 4; beep(ctx.currentTime, f); osc('triangle', f * 2, ctx.currentTime, 0.002, 0.035, 0.14, bus); }
    else beep(ctx.currentTime, tones[0] * 4);
    lastGood = now; FX.goodLane = target.lane; ring(j === 'perfect' ? C.ok : '#ffe9a8', target.lane);
    spawnBits(j === 'perfect' ? 14 : 6);
    FX.punchAt = now; FX.punch = milestone ? 1.6 : j === 'perfect' ? 1 : 0.5;
    FX.marks.push({ d, at: now, c: j === 'perfect' ? C.ok : '#ffe9a8' });
    if (isSpecial(target)) stats.special++;
    if (target.late) FX.react[target.lane] = { type: 'relief', at: now };
    else if (j === 'perfect') FX.react[target.lane] = { type: 'nod', at: now };
    if (target.heavy) { lastHeavy = now; FX.shakeUntil = now + 90; thud(ctx.currentTime, 0.5); }
    const dark = blackout(target.beat);
    popJudge(j, milestone || (dark ? '소리로' : target.heavy ? '두 손' : j === 'good' ? (d < 0 ? '빠름' : '늦음') : ''), target.lane);
    if (target.len) { target.state = 'holding'; startHold(); } else target.state = 'hit';
    if (target.i === notes.length - 1 && j === 'perfect') FX.shakeUntil = now + 220;
  } else { target.state = 'miss'; target.missKind = 'bad'; registerMiss(d < 0 ? '너무 빠름' : '너무 늦음', d, 'bad', target.lane); }
}
// heavy boxes need two different keys inside a short window; one hand alone drops it
function onHit(ts, key, lane = 0) {
  const t = songAt(ts) - offsetMs / 1000;
  if (L.lanes === 2 && lane === 0) lastPressUpper = performance.now(); else lastPress = performance.now();
  if (heavyPend) {
    const hp = heavyPend;
    if (hp.key !== key && performance.now() - hp.at < 110) { clearTimeout(hp.timer); heavyPend = null; judgeNote(hp.n, hp.t); return; }
  }
  const target = findTarget(t, lane);
  if (!target) { click(ctx.currentTime); return; }
  if (target.heavy) {
    if (heavyPend && heavyPend.n === target) return;
    heavyPend = { n: target, t, key, at: performance.now(), timer: setTimeout(() => {
      if (heavyPend && heavyPend.n === target && target.state === 'pending') { heavyPend = null; target.state = 'miss'; target.missKind = 'bad'; target.hitAt = t; registerMiss('두 손으로!', null, 'bad'); }
    }, 110) };
    return;
  }
  judgeNote(target, t);
}
function completeHold(n) {
  const now = performance.now();
  n.state = 'hit'; n.doneAt = songAt(now); stats.tailOk++; const milestone = addCombo(); stopHold();
  beep(ctx.currentTime, 2093); tear(ctx.currentTime);
  lastGood = now; FX.goodLane = n.lane; ring(C.ok, n.lane); spawnBits(16); FX.punchAt = now; FX.punch = 1.4; FX.shakeUntil = now + 150; FX.react[n.lane] = { type: 'nod', at: now };
  popJudge('done', milestone, n.lane);
}
function onRelease(ts, lane = 0) {
  const t = songAt(ts) - offsetMs / 1000;
  for (const n of notes) {
    if (n.state !== 'holding' || n.lane !== lane) continue;
    if (t >= n.end - WIN_REL) completeHold(n);
    else {
      n.state = 'broken'; n.brokeAt = t; stats.tailBroken++; stopHold();
      spawn(SCAN_X - 4, BELT_Y - 8, 12, ['#d8eef5', '#ffffff', '#9fc6d4'], -70, 70, -110, -40, 360);
      failFx('broken', 'broken', '너무 일찍 뗌', null, lane);
    }
  }
}
function judgeTick(t) {
  const tt = t - offsetMs / 1000;
  for (const n of notes) {
    if (n.state === 'pending' && tt - n.arr > WIN_M) { n.state = 'miss'; n.hitAt = tt; n.missKind = 'pass'; registerMiss('지나감', null, 'pass', n.lane); }
    else if (n.state === 'holding' && tt >= n.end) completeHold(n);
  }
}

// ---------- overlays ----------
const hud = $('hud'), clockEl = $('clock'), comboEl = $('combo'), bubble = $('bubble'), hint = $('hint');
let lastClock = '', lastCombo = -1, lastSay = '', lastHint = '';
function updateHud(t) {
  const beat = beatAt(t);
  const [hh, mm] = L.clock.split(':').map(Number);
  const mins = mm + Math.max(0, Math.floor(beat / 4)), c = `B동 3번 라인 · ${String(hh + Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
  if (c !== lastClock) { clockEl.textContent = c; lastClock = c; }
  if (stats.combo !== lastCombo) { comboEl.textContent = '콤보 ' + stats.combo; comboEl.classList.toggle('hot', stats.combo >= 10); lastCombo = stats.combo; }
  const line = L.say.find(([b, , d]) => beat >= b && beat < b + d);
  const s = line ? line[1] : FX.bossLine && t < FX.bossLine.until ? FX.bossLine.text : '';
  if (s !== lastSay) {
    bubble.textContent = s; bubble.hidden = !s; lastSay = s;
    const lane = line ? (line[3] || 0) : 0;
    bubble.style.bottom = L.lanes === 2 ? (lane === 0 ? '78%' : '58%') : '61%';
  }
  let h = '';
  if (L.tutorial) for (let i = 0; i < 3; i++) { const n = notes[i]; if (n && n.state === 'pending' && t > n.place) { h = '상자가 빨간 선에 닿을 때 터치'; break; } }
  const hintFor = (key, text, holdText) => {
    const n = firstWith(key); if (!n) return;
    if (n.state === 'pending' && t > n.place - (key === 'ghost' ? 0 : 0)) h = text;
    if (holdText && n.state === 'holding') h = holdText;
  };
  hintFor('len', '앞이 닿으면 누르고, 끝까지 유지', '유지…');
  hintFor('heavy', '무거운 상자: 양쪽을 같이');
  if (L.id === 's1-1') {
    const offb = notes.find(n => n.beat % 2 === 1), pair = notes.find(n => n.beat % 1 === 0.5);
    if (offb && offb.state === 'pending' && t > offb.place - SPB) h = '짝: 2박, 4박에도 와요';
    if (pair && pair.state === 'pending' && t > pair.place - SPB) h = '짝짝: 두 번 빠르게';
  }
  if (L.id === 'jiwoo') {
    if (notes[4] && notes[4].state === 'pending' && t > notes[4].place) h = '머리 끄덕 다음에 손. 그 사이에 터치';
    const fl = firstWith('late'); if (fl && fl.state === 'pending' && t > fl.place) h = '지우가 졸아요. 손이 늦어요. 손을 봐요';
  }
  if (L.id === 'sunja') { const n = notes.find(x => x.beat % 1 === 0.25 || x.beat % 1 === 0.75); if (n && n.state === 'pending' && t > n.place - 0.3) h = '탁탁: 손목으로 두 번'; }
  if (L.lanes === 2) {
    const f1 = notes.find(n => n.lane === 1);
    if (notes[0].state === 'pending' && t > notes[0].place) h = '주황 = 왼쪽';
    if (f1 && f1.state === 'pending' && t > f1.place) h = '연두 = 오른쪽';
    if (blackout(beat)) h = '정전! 소리로';
  }
  if (h !== lastHint) { hint.textContent = h; hint.hidden = !h; lastHint = h; }
}

const dialogEl = $('dialog'), whoEl = $('who'), textEl = $('dtext');
let dlg = null, typeTimer = null;
function runDialog(lines, done) { dlg = { lines, i: 0, done, n: 0, full: '' }; dialogEl.hidden = false; showLine(); }
function showLine() {
  const L_ = dlg.lines[dlg.i], robot = L_.who === 'AS-7';
  whoEl.textContent = L_.who; whoEl.hidden = !L_.who; whoEl.classList.toggle('robot', robot);
  textEl.classList.toggle('narr', !L_.who); textEl.classList.toggle('robot', robot);
  dlg.full = L_.text; dlg.n = 0; clearInterval(typeTimer);
  if (reduce) { dlg.n = L_.text.length; textEl.textContent = L_.text; return; }
  textEl.textContent = '';
  const pitch = { '반장': 220, '지우': 392, '박씨': 196, '순자 이모': 440 }[L_.who] || 330;
  typeTimer = setInterval(() => {
    if (!dlg) return clearInterval(typeTimer);
    dlg.n++; textEl.textContent = dlg.full.slice(0, dlg.n);
    if (L_.who && dlg.n % 3 === 0) blip(pitch);
    if (dlg.n >= dlg.full.length) clearInterval(typeTimer);
  }, robot ? 22 : 32);
}
function advanceDialog() {
  if (!dlg) return;
  if (dlg.n < dlg.full.length) { clearInterval(typeTimer); dlg.n = dlg.full.length; textEl.textContent = dlg.full; return; }
  dlg.i++;
  if (dlg.i >= dlg.lines.length) { const d = dlg.done; dlg = null; dialogEl.hidden = true; d(); }
  else showLine();
}
$('skip').addEventListener('click', e => {
  e.stopPropagation(); if (!dlg) return;
  clearInterval(typeTimer); const d = dlg.done; dlg = null; dialogEl.hidden = true; d();
});

// attendance board
const cardsEl = $('cards');
function buildCards() {
  cardsEl.innerHTML = '';
  STAGE1.forEach((it, i) => {
    const lv = it.level, locked = !lv;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'card' + (it.boss ? ' boss' : ''); b.style.setProperty('--tilt', ((i * 7) % 5 - 2) * 0.5 + 'deg');
    if (locked) b.disabled = true;
    const c = document.createElement('canvas'); c.width = 40; c.height = 64;
    const info = document.createElement('div'); info.className = 'info';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = `${lv ? lv.stageNo : it.no} ${lv ? lv.title : it.title}`;
    const role = document.createElement('span'); role.className = 'role'; role.textContent = lv ? lv.role : it.role;
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = lv ? lv.tag : it.tag;
    info.append(name, role, tag);
    b.append(c, info);
    if (locked) { const lk = document.createElement('span'); lk.className = 'lock'; lk.textContent = '준비 중'; b.append(lk); }
    if (lv && progress[lv.id] != null) { const best = document.createElement('span'); best.className = 'best'; best.textContent = (progress[lv.id] * 100).toFixed(0) + '%'; b.append(best); }
    if (lv) b.addEventListener('click', e => { e.stopPropagation(); beginShift(lv); });
    cardsEl.append(b);
    const saved = g; g = c.getContext('2d'); g.fillStyle = it.boss ? '#3a1e1a' : '#2a211c'; g.fillRect(0, 0, 40, 64);
    const pid = lv ? lv.partners[0] : it.pid, P = PARTNERS[pid];
    g.save(); g.translate(20 - BOSS_X, 8 - P.base);
    const pose = { hand: { x: BOSS_X + 13, y: P.base + 44 }, carry: null, wince: false, dip: 0, bob: 0, nod: 0, doze: false, phone: false, lane: 0 };
    P.draw(pose, 0, false); P.arm(pose); g.restore();
    g = saved;
  });
}
function openBoard() { ensureAudio(); state = 'select'; $('title').hidden = true; $('result').hidden = true; dialogEl.hidden = true; buildCards(); $('select').hidden = false; }

function beginShift(level) {
  ensureAudio(); loadLevel(level); resetRun(); handLabels();
  $('title').hidden = true; $('result').hidden = true; $('select').hidden = true; state = 'intro';
  runDialog(level.intro, startPlay);
}
function startPlay() {
  ensureAudio(); resetRun();
  $('title').hidden = true; $('result').hidden = true; $('select').hidden = true;
  events = buildEvents(); evI = 0; T0 = ctx.currentTime + 0.8;
  lastClock = ''; lastCombo = -1; lastSay = ''; lastHint = '';
  musF.frequency.cancelScheduledValues(ctx.currentTime); musF.frequency.setValueAtTime(musBase(), ctx.currentTime);
  hud.hidden = false; state = 'play'; startHum();
}
function accuracy() { return (stats.perfect + stats.good * 0.6 + stats.tailOk) / (notes.length + notes.filter(n => n.len).length); }
function finishPlay() {
  state = 'outro'; stopHum(); stopHold(); bubble.hidden = true; hint.hidden = true;
  const acc = accuracy();
  try { if ((progress[L.id] || 0) < acc) { progress[L.id] = acc; localStorage.setItem('belt.progress', JSON.stringify(progress)); } } catch (e) {}
  runDialog(L.outro(acc >= 0.8, stats.special), showResult);
}
let runNo = 0;
function showResult() {
  state = 'result'; hud.hidden = true; runNo++;
  const acc = accuracy();
  $('r-no').textContent = 'B03-' + L.clock.replace(':', '') + '-' + String(runNo).padStart(4, '0');
  $('r-title').textContent = L.title;
  $('r-from').textContent = `${L.who} · 3번 라인`;
  $('r-counts').textContent = `딱 ${stats.perfect} · 좋아 ${stats.good} · 놓침 ${stats.miss + stats.tailBroken}`;
  $('r-combo').textContent = stats.maxCombo;
  $('r-special-k').textContent = L.special[0];
  $('r-special').textContent = `${stats.special} / ${specialTotal()} ${L.special[2]}`;
  $('r-acc').textContent = (acc * 100).toFixed(1) + '%';
  $('r-stamp').textContent = acc >= 0.9 ? '완벽 페어' : acc >= 0.75 ? '정상 처리' : acc >= 0.5 ? '재확인' : '재작업';
  $('result').hidden = false;
  $('retry').focus({ preventScroll: true });
}
$('start').addEventListener('click', e => { e.stopPropagation(); openBoard(); });
$('retry').addEventListener('click', e => { e.stopPropagation(); startPlay(); });
$('again').addEventListener('click', e => { e.stopPropagation(); beginShift(L); });
$('board').addEventListener('click', e => { e.stopPropagation(); openBoard(); });

// ---------- input ----------
// held maps an input id to the lane it pressed. Left hand = F/D or the left half of the screen.
const held = new Map();
const LEFT_KEYS = new Set(['KeyF', 'KeyD']);
const KEYS = new Set(['Space', 'Enter', 'KeyJ', 'KeyF', 'KeyD', 'KeyK']);
function laneOf(side) { return L.lanes === 2 ? (side === 'L' ? 0 : 1) : 0; }
function handLabels() {}
function press(ts, key, lane) {
  if (state === 'play') onHit(ts, key, lane);
  else if (dlg) advanceDialog();
  else if (state === 'title') openBoard();
}
function releaseKey(ts, key) {
  const lane = held.get(key); if (lane == null) return; held.delete(key);
  if (state === 'play' && ![...held.values()].includes(lane)) onRelease(ts, lane);
}
function ripple(x, y, side) {
  if (state !== 'play') return;
  const el = document.createElement('span');
  el.className = 'ripple' + (L.lanes === 2 ? ' ' + side : '');
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.addEventListener('animationend', () => el.remove());
  stage.append(el);
}
addEventListener('keydown', e => {
  if (!KEYS.has(e.code)) return;
  const onButton = e.target instanceof Element && e.target.closest('button');
  if (state !== 'play' && onButton) return;
  e.preventDefault();
  if (e.repeat) return;
  const side = LEFT_KEYS.has(e.code) ? 'L' : 'R', lane = laneOf(side);
  held.set(e.code, lane); press(e.timeStamp, e.code, lane);
});
addEventListener('keyup', e => releaseKey(e.timeStamp, e.code));
const stage = $('stage');
stage.addEventListener('pointerdown', e => {
  if (e.target instanceof Element && e.target.closest('button, .label, .board')) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, side = x < r.width / 2 ? 'L' : 'R', lane = laneOf(side);
  ripple(x, y, side);
  held.set('p' + e.pointerId, lane); press(e.timeStamp, 'p' + e.pointerId, lane);
});
const up = e => releaseKey(e.timeStamp, 'p' + e.pointerId);
addEventListener('pointerup', up); addEventListener('pointercancel', up);
addEventListener('blur', () => { for (const k of [...held.keys()]) releaseKey(performance.now(), k); });

// ---------- loop ----------
function frame(now) {
  requestAnimationFrame(frame);
  const active = state === 'play';
  const t = active ? songAt(now) : -99;
  if (active) {
    schedule(); judgeTick(t); updateHud(t);
    if (t > timeAt(END_BEAT)) finishPlay();
  }
  drawScene(t, now / 1000, active, now);
}
requestAnimationFrame(frame);
})();
</script>
</body>
