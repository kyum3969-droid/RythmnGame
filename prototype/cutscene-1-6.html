<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1-6 컷씬 · 새벽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 1-6 cutscene, drawn live in the game's own pixels: the same 384x216 screen, the same 하은, belt and warehouse as index.html,
   at the game's own scale the whole way through (no zoom, no crop). */
:root{
  --night:#15110e; --panel:#1f1915; --line:#3a2f28; --ink:#efe6d2; --muted:#a6978a; --accent:#d9a520;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#15110e}}
:root[data-theme="dark"]{--night:#15110e}
[hidden]{display:none!important}
html,body{min-height:100%} body{box-sizing:border-box;margin:0}
body{background:#0a0807;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding:10px 16px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100dvh}
/* the picture is sized to fit the window with the controls under it (auto margins centre it without ever pushing it off the top) */
.page{width:min(100%,calc((100dvh - 140px) * 16 / 9));max-width:100%;display:flex;flex-direction:column;gap:8px;margin-block:auto}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:4px;background:#000;
  box-shadow:0 0 0 1px #000,0 0 40px rgba(0,0,0,.6);cursor:pointer;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,5,4,.45)}
.big span{font:400 clamp(18px,4vw,34px) var(--display);background:var(--ink);color:#1d1815;padding:.35em 1em;border-radius:3px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:600 14px var(--body);min-height:36px;padding:0 14px;border-radius:3px;border:0;background:var(--ink);color:#1d1815;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.btn:focus-visible,input:focus-visible{outline:2px solid #2f6f8a;outline-offset:2px}
.time{font:500 13px var(--mono);color:var(--muted);min-width:7.5em}
.scrub{position:relative;flex:1 1 220px;min-width:160px}
.scrub input{width:100%;margin:0;accent-color:var(--accent)}
.shots{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.shot{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;white-space:nowrap}
.shot.on{border-color:var(--accent)}
.shot b{font:400 14px var(--display);letter-spacing:.01em}
.shot .t{font:500 11px var(--mono);color:var(--muted);margin-left:6px}
.shot p{display:none}
.help{margin:0;font-size:12px;color:var(--muted)} .help b{color:var(--ink)} #res{color:var(--accent);margin-left:6px}
</style>
</head>
<body>
<div class="page">
  <div class="stage" id="stage">
    <canvas id="cv" width="1152" height="648" aria-label="1-6 컷씬: 빈 벨트 앞에서 하은이 고개를 들고, 공장 밖으로 걸어 나간다"></canvas>
    <div class="big" id="big"><span>▶ 재생</span></div>
  </div>
  <div class="bar">
    <button class="btn" id="play" type="button">재생</button>
    <button class="btn ghost" id="restart" type="button">처음부터</button>
    <div class="scrub"><input id="seek" type="range" min="0" max="125" step="0.01" value="0" aria-label="재생 위치"></div>
    <span class="time" id="time">00.0 / 124.8</span>
    <button class="btn ghost" id="hb" type="button" aria-pressed="true">심박 줄</button>
    <button class="btn ghost" id="snd" type="button" aria-pressed="true">소리</button>
  </div>
  <div class="shots" id="shots"></div>
  <p class="help">심박 줄: 줄마다 세 번은 저절로 뛰고, <b>네 번째 박</b>에 화면을 누르거나 J·F·K·D·스페이스. 일시정지는 버튼이나 P, ←/→ 1초 이동. <span id="res"></span></p>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const W = 384, H = 216, SC = 3;
const cv = $('cv'), out = cv.getContext('2d');
// every shot is drawn at the game's 1x into this buffer; the camera crops it and blows it up without smoothing
const wb = document.createElement('canvas'); wb.width = W; wb.height = H; const wctx = wb.getContext('2d');
// 하은 is drawn on her own small sheet first, so her outline can catch the light (the rim pass)
const SPR_W = 64, SPR_H = 96, SPR_CX = 32, SPR_TOP = 24;
const sb = document.createElement('canvas'); sb.width = SPR_W; sb.height = SPR_H; const sctx = sb.getContext('2d');
const rb = document.createElement('canvas'); rb.width = SPR_W; rb.height = SPR_H; const rctx = rb.getContext('2d');
let g = wctx;

const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const lerp = (a, b, p) => a + (b - a) * p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = p => p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p);
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const thick = (x1, y1, x2, y2, s, c) => { const d = Math.max(1, Math.hypot(x2 - x1, y2 - y1)); for (let k = 0; k <= d; k++) { const p = k / d; R(lerp(x1, x2, p) - s / 2, lerp(y1, y2, p) - s / 2, s, s, c); } };
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; };

// the game's palette (index.html C)
const C = {
  kraft:'#c48b52', kraftTop:'#d9a468', kraftDark:'#8f6236', tape:'#e6c88f', ink:'#1b1716', skin:'#d9a27a', skinDark:'#b98260',
  laser:'#ff4a3d', ok:'#8fd694', belt:'#38302c', slat:'#2a2320', face:'#171312', metal:'#6a7075'
};
const SCAN_X = 300, BELT_Y = 146;

// ---------- the song (the heartbeat rows' chart, the same as stage1-6.html) ----------
// The rows run on this chart while the cutscene plays under them. The cutscene keeps its own length and timing: the song is
// going to be made again, so nothing in the pictures waits on it (only the ward's monitor blips along with the rows).
const SEG = [62, 62, 62, 62, 62, 68, 68, 56, 72, 60, 60, 66, 58, 64, 64, 64, 64, 60, 60, 60];
const LEAD = 2.4;
const SEGT = []; { let t = LEAD; for (const b of SEG) { SEGT.push(t); t += 8 * 60 / b; } SEGT.push(t); }
const beatT = b => { const s = clamp(Math.floor(b / 8), 0, SEG.length - 1); return SEGT[s] + (b - s * 8) * 60 / SEG[s]; };
const tBeat = t => { if (t < LEAD) return (t - LEAD) * SEG[0] / 60; let s = 0; while (s < SEG.length - 1 && t >= SEGT[s + 1]) s++; return s * 8 + (t - SEGT[s]) * SEG[s] / 60; };

// ---------- the timeline ----------
// One long take, no cuts: the same frame from the empty belt to the street. The chapters only mark where to jump to.
const SHOTS = [
  { id: 'belt', t0: 0, t1: 10.2, name: '빈 벨트', note: '벨트가 서고 등이 하나씩 꺼진다. 높은 창으로 햇살이 든다. 하은이 벨트를 두 번 두드리고, 빛 쪽으로 고개를 든다.' },
  { id: 'walk', t0: 10.2, t1: 24.3, name: '공장 밖으로', note: '컷 없이 이어서 걸어 나간다. 하은은 화면 제자리, 배경이 흐른다(창과 선반, 앞의 빈 라인, 기둥). 다리는 벨트와 담장 뒤로 가려진다. 셔터 밑을 지나 바깥 새벽으로.' },
  { id: 'station', t0: 24.3, t1: 35.0, name: '지하철역', note: '새벽 거리(울타리, 셔터 내린 가게, 24시 편의점)를 한참 걷다가 걸음이 느려지는 동안 배경만 천천히 지하철역 승강장으로 바뀐다. 하은은 스크린도어 앞에 서서 시계를 보고, 유리 너머로 첫차가 들어와 문이 열린다.' },
  { id: 'train', t0: 35.0, t1: 46.4, name: '열차 안', note: '문이 열리면 배경만 천천히 열차 안으로 바뀐다. 출근길 사람들로 붐비는 객실. 하은은 손잡이를 잡고, 열차가 달리다 다음 역에 선다.' },
  { id: 'off', t0: 46.4, t1: 52.0, name: '내리는 역', note: '문이 열리면 배경만 내리는 역 승강장으로 바뀐다. 하은 뒤로 문이 닫히고 열차가 떠난다.' },
  { id: 'alley', t0: 52.0, t1: 66.0, name: '골목길', note: '배경만 아침 골목으로 바뀌고 하은이 걷는다. 빨간 벽돌 담장과 화분, 다세대 주택, 전봇대와 전깃줄, 볼록거울, 담장 위 고양이, 작은 슈퍼.' },
  { id: 'hospital', t0: 66.0, t1: 70.2, name: '병원', note: '골목 끝에 병원이 나온다. 하은이 병원 앞에서 멈추고 건물을 올려다본다.' },
  { id: 'corridor', t0: 70.2, t1: 86.0, name: '병원 복도', note: '병원 앞이 암전되고, 깜깜한 복도에서 천장 등이 하나씩 켜진다. 하은이 걸어가 502호 문 앞에서 멈춘다.' },
  { id: 'ward', t0: 86.0, t1: 108, name: '병실', note: '배경만 502호 병실로 바뀐다. 침상에 누운 어머니, 머리맡 심박 모니터, 창으로 들어오는 아침 해. 하은은 침상 옆에 섰다가 의자에 앉아 어머니 손을 잡고, 침상 쪽으로 고개를 숙였다가, 어머니 손가락이 움직이자 고개를 든다.' },
  { id: 'clip', t0: 108.6, t1: 124.8, name: '꽃다발', note: '암전 뒤 영상: 신입이 꽃다발을 들고 병실 문을 두드리고, 하은이 문을 열고 받는다(구간별로 느리게 다듬은 영상). 심박 줄은 없음.' }
];
const CUT_END = 108;   // the drawn cutscene's own length (not the song's); it fades to black here
// then, after a beat of black, the ward-visit clip (prototype/media; slowed by section with media/retime.sh), with the rows gone
const CLIP = { t0: CUT_END + 0.6, dur: 16.0, src: 'media/1-6-ward-visit-paced' };   // .mp4 (H.264), or .webm (VP9) where H.264 won't play
const END = CLIP.t0 + CLIP.dur + 0.2;
// at the belt (seconds)
const S1 = { beltStop: 2.6, taps: [3.4, 3.8], laserOff: 3.9, tubesOff: [5.7, 5.1, 4.5], look: [7.3, 8.7], letGo: 9.6 };
// she stands at x 222 the whole take; once she walks the world slides by. d = how far she has walked (px), easing into her pace
const HX = 222, HTOP = 106;
// she eases into her pace over WALK.ramp and eases out of it again, standing still at WALK.stop
const WALK = { t0: 10.2, ramp: 0.8, v: 30, door: 210, step: 0.55, lampOff: 21.0, stop: 25.2 };
const WB_ = WALK.t0 + WALK.ramp, WC_ = WALK.stop - WALK.ramp, dB_ = WALK.v * WALK.ramp / 2, dC_ = dB_ + WALK.v * (WC_ - WB_);
const walkD = t => { const v = WALK.v, r = WALK.ramp;
  if (t <= WALK.t0) return 0; if (t < WB_) return v * (t - WALK.t0) ** 2 / (2 * r); if (t < WC_) return dB_ + v * (t - WB_);
  const u = Math.min(t, WALK.stop) - WC_; return dC_ + v * u - v * u * u / (2 * r); };
const walkT = d => { let a = WALK.t0, b = WALK.stop; for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (walkD(m) < d) a = m; else b = m; } return b; };   // the time she has walked d
// as she slows down on the street, only the background changes: the station platform comes in behind her through a wide soft
// gradient while she stays as she is. She waits at the screen doors, checks her watch, and the first train pulls in behind the glass
const WIPE = { t0: 24.3, t1: 27.8 };
const ST = { chime: 28.4, watch: [28.8, 30.2], light: 30.4, arrive: [31.2, 33.8], open: 34.3 };
// boarding: the doors open, the background turns slowly into the crowded car around her, the doors close, the train pulls out
const BOARD = { t0: 35.0, t1: 38.2 };
const RIDE = { strap: 38.6, close: 38.3, depart: 39.0, clack0: 39.9, gap: 0.9, slow: 43.4, stop: 45.6, open: 46.0 };
// off at the next station: the car turns into its platform, the doors close behind her, the train leaves
const DEST = { t0: 46.4, t1: 49.4, close: 49.9, leave: 50.5 };
// then the morning alley, walking again (legs behind a low brick wall), to the hospital at its end
const ALLEY = { t0: 52.0, t1: 55.4 };
const WALK2 = { t0: 51.6, ramp: 0.9, v: 30, stop: 67.6 };   // she sets off on the platform; the alley comes in around her as she walks
const walk2D = t => { const v = WALK2.v, r = WALK2.ramp, b = WALK2.t0 + r, c = WALK2.stop - r, dB = v * r / 2, dC = dB + v * (c - b);
  if (t <= WALK2.t0) return 0; if (t < b) return v * (t - WALK2.t0) ** 2 / (2 * r); if (t < c) return dB + v * (t - b);
  const u = Math.min(t, WALK2.stop) - c; return dC + v * u - v * u * u / (2 * r); };
// then the hospital's corridor, dark this early: the lights come on one panel at a time ahead of her as she walks, to 502
const CORR = { t0: 70.2, t1: 71.3 };
// the ward: background only again, then she sits, takes her mother's hand, bows her head toward the bed, feels the hand close a
// little and lifts her head (fixed times, not tied to the song)
const WARD = { t0: 86.0, t1: 89.0, sit: 91.5, hold: 93.0, rest: 95.5, squeeze: 99.0, lift: 100.5, knock: 103.0, turn: 103.9 };   // the hospital front fades to full black, then the corridor's lights come on one at a time
const WALK3 = { t0: 73.4, ramp: 0.9, v: 30, stop: 84.2 };
const walk3D = t => { const v = WALK3.v, r = WALK3.ramp, b = WALK3.t0 + r, c = WALK3.stop - r, dB = v * r / 2, dC = dB + v * (c - b);
  if (t <= WALK3.t0) return 0; if (t < b) return v * (t - WALK3.t0) ** 2 / (2 * r); if (t < c) return dB + v * (t - b);
  const u = Math.min(t, WALK3.stop) - c; return dC + v * u - v * u * u / (2 * r); };
const walk3T = d => { let a = WALK3.t0, b = WALK3.stop; for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (walk3D(m) < d) a = m; else b = m; } return b; };
const walk2T = d => { let a = WALK2.t0, b = WALK2.stop; for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (walk2D(m) < d) a = m; else b = m; } return b; };
const D_STOP = walkD(WALK.stop);
const doorT = walkT(WALK.door);   // when she passes under the shutter
const STRIDE = WALK.v * WALK.step;  // px per step

// ---------- 하은 (index.html drawHaeunAt, with a head that can tip down and lift) ----------
// o.mirror: facing right. o.look: -1 head down over the belt, 0 level, 1 lifted into the light. Her eyes are never drawn: the cap's shadow always lies across them.
// o.arms: 'belt' both hands on the belt edge (o.tap lifts the near one), 'walk' both arms swing a little, opposite each
// other (o.fN near hand forward, o.fF far hand back, in px). o.sway moves the hair.
let FACE_LINE = null;
function haeun(cx, top, o = {}) {
  const hair = '#17121a', hairL = '#2e2630', shirt = '#1e1a1a', shirtD = '#121010', cap = '#d8463b', capD = '#a83328', brim = '#c43d33', sky = '#86c3e8', tee = '#e9f3f7', leg = '#3a3f45', shoe = '#1e1a1a';
  const look = o.look || 0, sw = o.sway || 0;
  const hx = look < -0.5 ? -1 : 0, hy = look < -0.25 ? Math.round(-look * 2) : look > 0.5 ? -1 : 0, tilt = look < -0.5 ? 1 : look > 0.5 ? -1 : 0;
  g.save(); if (o.mirror) { g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); }
  // legs: sitting (the lap on a chair, shins down), standing, or walking one leg at a time (o.stride = { leg: 0 near / 1 far, p: 0..1 through the step }): the moving
  // leg lifts and swings forward in an arc and sets down, the other stays planted; the next step it's the other leg's turn
  const sw_ = o.stride ? Math.sin(Math.PI * o.stride.p) : 0, fwd = Math.round(3 * sw_), lift = Math.round(2 * sw_);
  const nx = o.stride && o.stride.leg === 0 ? -fwd : 0, ny = o.stride && o.stride.leg === 0 ? -lift : 0;
  const fx_ = o.stride && o.stride.leg === 1 ? -fwd : 0, fy_ = o.stride && o.stride.leg === 1 ? -lift : 0;
  if (o.seated) { R(cx - 8, top + 36, 15, 6, leg); R(cx - 9, top + 42, 4, 11, leg); R(cx - 3, top + 42, 4, 11, leg); R(cx - 11, top + 52, 6, 3, shoe); R(cx - 4, top + 52, 6, 3, shoe); }
  else {
    R(cx + 2 + fx_, top + 38, 5, 15 + fy_, leg); R(cx + 2 + fx_, top + 52 + fy_, 6, 3, shoe);
    R(cx - 5 + nx, top + 38, 5, 16 + ny, leg); R(cx - 6 + nx, top + 53 + ny, 6, 3, shoe);
  }
  // only the back hair: long and straight, falling down her back past the shoulders (nothing in front of the face)
  R(cx + 6 + sw, top + 14, 4, 18, hair); R(cx + 8 + sw, top + 16, 1, 12, hairL);
  // sky-blue tee with the white stripe over black sleeves, black bottoms
  R(cx - 7, top + 16, 14, 23, shirt); R(cx - 7, top + 15, 14, 16, sky); R(cx - 7, top + 27, 14, 2, tee); R(cx - 7, top + 30, 14, 9, shirtD);
  // the head, smaller than the rest of the cast (a 10x12 face under a 12-wide cap, chin where theirs is). Tipped down it sinks
  // two pixels into the collar and leans one forward.
  const fx = cx + hx, ft = top + hy;
  if (o.headFront) {
    // the head turned to us, halfway through turning round: the cap square on, its brim straight across, the shadow under it,
    // nose and mouth in the middle (no face line: that is her profile's edge)
    R(fx - 5, ft + 3, 10, 12, C.skin);
    R(fx - 6, ft, 12, 6, cap); R(fx - 5, ft - 1, 10, 1, cap); R(fx - 6, ft + 5, 12, 1, capD); R(fx - 1, ft - 2, 2, 1, capD); R(fx - 2, ft + 1, 4, 2, '#f4e6e0');
    R(fx - 8, ft + 5, 16, 2, brim); R(fx - 8, ft + 5, 16, 1, cap); R(fx - 8, ft + 7, 16, 1, capD);
    R(fx - 5, ft + 8, 10, 2, '#3a2622'); R(fx - 5, ft + 10, 10, 1, '#8a5a44');
    R(fx - 1, ft + 11, 2, 1, '#b07a58'); R(fx - 1, ft + 13, 2, 1, '#b2565a');
    FACE_LINE = null;
  } else {
    R(fx + 3, ft + 3, 4, 12, hair);   // the back of her head under the cap, running into the hair down her back
    R(fx - 5, ft + 3, 10, 12, C.skin);
    R(fx - 6, ft, 12, 6, cap); R(fx - 5, ft - 1, 10, 1, cap); R(fx - 6, ft + 5, 12, 1, capD); R(fx - 2, ft - 1, 1, 7, capD); R(fx - 1, ft - 2, 2, 1, capD);
    R(fx - 5, ft + 1, 3, 2, '#f4e6e0');
    // the brim: its tip dips with the head or tilts up with it
    R(fx - 9, ft + 4, 3, 2, brim); R(fx - 9, ft + 4, 3, 1, cap); R(fx - 9, ft + 6, 3, 1, capD);

      if (fl > 0) { g.save(); g.globalCompositeOperation = 'lighter'; const fx = g.createRadialGradient(COL, y0 - 7, 0, COL, y0 - 7, 26); fx.addColorStop(0, `rgba(255,240,170,${0.4 * fl})`); fx.addColorStop(1, 'rgba(255,240,170,0)'); g.fillStyle = fx; g.fillRect(COL - 26, y0 - 33, 52, 52); g.restore(); } }
    drawLane(0, y0, t, 1);
    if (two > 0) drawLane(1, y1, t, e2);
    const now = performance.now();
    // the rings and sparks from good presses
    for (let i = RINGS.length - 1; i >= 0; i--) { const r = RINGS[i], a = (now - r.at) / (r.big ? 600 : 450); if (a < 0) continue; if (a >= 1) { RINGS.splice(i, 1); continue; } const k = r.big ? 3.2 : 2; g.save(); g.globalAlpha = (1 - a) * (r.big ? 0.7 : 0.9); g.strokeStyle = r.big ? '#bfffe0' : '#d8fbff'; g.lineWidth = 2.4 * (1 - a) + 0.4; g.beginPath(); g.ellipse(r.x, r.y - 6, 6 + 26 * k * ease(a), 4 + 14 * k * ease(a), 0, 0, Math.PI * 2); g.stroke(); g.restore(); }
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = SPARKS.length - 1; i >= 0; i--) { const p = SPARKS[i], a = (now - p.at) / p.life; if (a >= 1) { SPARKS.splice(i, 1); continue; } const tt = (now - p.at) / 1000; g.globalAlpha = (1 - a); g.fillStyle = p.c; if (p.plus) { const px = p.x + p.vx * tt * (1 - a * 0.5), py = p.y + p.vy * tt * (1 - a * 0.5) + 10 * tt * tt, z = p.s * (1 - a * 0.4); g.fillRect(px - z, py - z * 0.3, z * 2, z * 0.6); g.fillRect(px - z * 0.3, py - z, z * 0.6, z * 2); continue; } g.beginPath(); g.arc(p.x + p.vx * tt, p.y - 6 + p.vy * tt + 50 * tt * tt, p.s * (1 - a * 0.5), 0, Math.PI * 2); g.fill(); }
    g.restore(); g.globalAlpha = 1;
  }
  function reset() {

    drawRows(t);
    const tl = beatT(SEG.length * 8 - 2);
    if (t > tl) { const a = clamp((t - tl) / 0.8, 0, 1), sc = 1 + 0.15 * (1 - a); g.save(); g.globalAlpha = a; g.translate(W / 2, 64); g.scale(sc, sc); glowTxt('심박 안정', 0, -10, '#f0fff4', 20, 'center', '"Black Han Sans", sans-serif', 'rgba(120,255,170,.9)'); g.restore(); g.globalAlpha = 1; }
    G0.setTransform(1, 0, 0, 1, 0, 0);

  return {
    reset, begin, draw, stats, targets: () => TARGETS, boxWin: tg => boxWin(tg),
    halt() { playing = false; },
    clock() { return ac && playing ? ac.currentTime - startAt : null; },
    update(t) { if (!playing) return; schedule(); tick(t); FX.pops = FX.pops.filter(p => performance.now() - p.at < 650); },
    press(t) { press(t); },
    mute(m) { muted = m; if (out) out.gain.setTargetAtTime(m ? 0 : 0.9, ac.currentTime, 0.05); }
  };
})();

// ---------- playback ----------
let T = 10.2, playing = false, last = performance.now(), started = false;
const seek = $('seek'), playBtn = $('play'); seek.max = END.toFixed(2);
let hbOn = true;
function setPlaying(p) {
  if (p && T >= END - 0.01) T = 0;
  playing = p; playBtn.textContent = p ? '일시정지' : '재생'; $('big').hidden = p || started;
  if (p) { started = true; $('big').hidden = true; initAudio(); audioStart(T); if (hbOn && T < CUT_END) { if (T < 0.05) HB.reset(); HB.begin(T); } } else { audioStop(); HB.halt(); }
}
function jump(t) { T = clamp(t, 0, END); if (playing) { audioStart(T); if (hbOn && T < CUT_END) HB.begin(T); else HB.halt(); } }
playBtn.onclick = () => { if (!started) T = 0; setPlaying(!playing); };   // the first play starts from the top
const pressNow = e => HB.press(HB.clock() + (e.timeStamp - performance.now()) / 1000);
// the picture: while playing with the rows on, a touch is a press on the beat; otherwise it plays or pauses
$('stage').addEventListener('pointerdown', e => { if (playing && hbOn && T < CUT_END && HB.clock() != null) { e.preventDefault(); pressNow(e); return; } if (!started) T = 0; setPlaying(!playing); });
$('restart').onclick = () => { HB.reset(); jump(0); if (!playing) setPlaying(true); };
$('hb').onclick = () => { hbOn = !hbOn; $('hb').setAttribute('aria-pressed', hbOn); if (!hbOn) HB.halt(); else if (playing) HB.begin(T); };
let dragging = false;
seek.addEventListener('pointerdown', () => { dragging = true; });
addEventListener('pointerup', () => { dragging = false; });
seek.oninput = () => { started = true; $('big').hidden = true; jump(+seek.value); };
$('snd').onclick = () => { soundOn = !soundOn; $('snd').setAttribute('aria-pressed', soundOn); if (master) master.gain.setTargetAtTime(soundOn ? 0.85 : 0, ac.currentTime, 0.05); HB.mute(!soundOn); };
const PRESS_KEYS = new Set(['Space', 'Enter', 'KeyJ', 'KeyF', 'KeyK', 'KeyD']);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.code !== 'Space') return;
  if (PRESS_KEYS.has(e.code) && playing && hbOn && T < CUT_END && HB.clock() != null) { e.preventDefault(); if (!e.repeat) pressNow(e); return; }
  if (e.code === 'Space' || e.code === 'KeyP') { e.preventDefault(); if (!started) T = 0; setPlaying(!playing); }
  else if (e.code === 'ArrowLeft') jump(T - 1); else if (e.code === 'ArrowRight') jump(T + 1);
});
const shotsEl = $('shots');
SHOTS.forEach((s, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'shot';
  b.title = s.note; b.innerHTML = `<b>${i + 1}. ${s.name}</b><span class="t">${s.t0.toFixed(1)}–${s.t1.toFixed(1)}초</span>`;
  b.onclick = () => { started = true; $('big').hidden = true; jump(s.t0); if (!playing) setPlaying(true); };
  shotsEl.appendChild(b);
});
function showResult() {
  const st = HB.stats, n = st.perfect + st.good + st.miss; if (!hbOn || !n) return;
  $('res').textContent = `딱 ${st.perfect} · 좋아 ${st.good} · 놓침 ${st.miss} · 최대 연속 ${st.best} · 정확도 ${Math.round((st.perfect + st.good * 0.6) / n * 100)}%`;
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) { const hc = hbOn ? HB.clock() : null; T = hc != null ? hc : T + dt; if (T >= CUT_END && hc != null) { HB.halt(); showResult(); } if (T >= END) { T = END; setPlaying(false); } }
  const rows = hbOn && T < CUT_END;   // the rows are gone once the cutscene ends
  if (rows) HB.update(T);
  render(T); if (rows) HB.draw(T); audioTick(T); clipSync(T);
  // the rows go dark with the cutscene's fade, so they leave with it
  { const f = rows ? seg(T, CUT_END - 1.5, CUT_END - 0.1) : 0; if (f > 0) { out.setTransform(1, 0, 0, 1, 0, 0); out.fillStyle = `rgba(0,0,0,${f})`; out.fillRect(0, 0, cv.width, cv.height); } }
  if (!dragging) seek.value = T;
  $('time').textContent = `${T.toFixed(1).padStart(4, '0')} / ${END.toFixed(1)}`;
  const si = SHOTS.reduce((a, sh, i) => T >= sh.t0 ? i : a, 0); [...shotsEl.children].forEach((c, i) => c.classList.toggle('on', i === si));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__HB = HB;   // for testing
})();
