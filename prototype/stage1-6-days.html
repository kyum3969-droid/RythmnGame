<!doctype html>

<style>

[hidden]{display:none!important}
html,body{min-height:100%} body{box-sizing:border-box;margin:0}

  box-shadow:0 0 0 1px #000,0 0 40px rgba(0,0,0,.6);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,233,168,.08),transparent 60%),rgba(8,6,5,.9)}
.cover .k{font:500 clamp(11px,1.6vw,13px) var(--mono);letter-spacing:.14em;color:var(--muted)}
.cover h1{margin:0;font:400 clamp(30px,6.4vw,60px)/1 var(--display);letter-spacing:.01em}
.cover p{margin:0;max-width:34em;color:#cfc3b4;font-size:clamp(12px,1.7vw,15px)}
.go{font:400 clamp(16px,2.4vw,20px)/1 var(--display);background:var(--vest);color:#1b120c;border:0;border-radius:3px;padding:.6em 1.2em;
  box-shadow:0 3px 0 var(--vest-dark);cursor:pointer;text-decoration:none;display:inline-block}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--vest-dark)}
.go:focus-visible,.btn:focus-visible{outline:3px solid #ffe9a8;outline-offset:3px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:600 14px var(--body);min-height:36px;padding:0 14px;border-radius:3px;border:0;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.help{margin:0;font-size:12.5px;color:var(--muted)} .help b{color:var(--ink)}
</style>
</head>
<body>

    </div>
    <div class="cover" id="end7" hidden>

      <h1>하은의 새벽</h1>

    <p class="help">1-7 대화는 클릭이나 <b>Enter</b>로 넘김. 심박은 <b>넷째 박</b>에 화면을 누르거나 Space·J·F·K·D.</p>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const W = 384, H = 216, SC = 3;

const CROP = 20, BAR_TOP = 141, LETTERBOX = { bottom: 148 };
const cv = $('cv'), out = cv.getContext('2d');
const wb = document.createElement('canvas'); wb.width = W; wb.height = H; const wctx = wb.getContext('2d');

const sb = document.createElement('canvas'); sb.width = SPR_W; sb.height = SPR_H; const sctx = sb.getContext('2d');

const C = {

  laser:'#ff4a3d', ok:'#8fd694', belt:'#38302c', slat:'#2a2320', face:'#171312', metal:'#6a7075',
  hoodie:'#2f4f58', vest2:'#cfe04a', reflect:'#ebe5c9', hairDark:'#1e1a1a', label:'#efe6d2'

const SCAN_X = 300, BELT_Y = 146, HX = 222, HTOP = 106, JX = 262, PLAYER_X = 340, BOSS_X = 132;
const SK = ['#d9a27a', '#e3b48f', '#c99470', '#b8825e'];
let FACE_LINE = null, JFLOWERS = false, WHO = 'haeun', JPOSE = null;

// ---------- the room as the cutscene draws it (its own code), with the hour, the tubes, the belt and the laser set per shot ----------
const MARK = 29.25, SLOPE = 0.5;
const lay = (d, f) => q => q - d * f + HX;
const TUBE_Q = [-158, -38, 82];
const S1 = { tubesOff: [-99, -99, -99], laserOff: 1e9 };
let SUNK = 0, TUBEK = [1, 1, 1], RUN = 0;
const sunAt = () => SUNK, tubeOn = k => TUBEK[k], beltRun = () => RUN;
const GATES = [78, 338], BELT_END = -174;
const inShaft = (px, py, x, y, w) => { if (py < y) return 0; const s = (py - y) * SLOPE, a = x - s, b = x + w - s; return px < a || px > b ? 0 : Math.min(1, (px - a) / 6, (b - px) / 6); };

  for (let i = 0; i < 5; i++) R(x + 2 + Math.floor(rnd(x + i, 7) * (w - 4)), y + 1 + Math.floor(rnd(x + i, 8) * (h - 2)), 1, 1, mix('#1c2238', '#e8c27a', k));

function dust(t, shafts, a, area) {

    const x = area.x + ((rnd(i, 1) * area.w + t * (2 + rnd(i, 2) * 3) * (rnd(i, 5) < 0.5 ? -1 : 1) - (area.ox || 0)) % area.w + area.w) % area.w;
    const y = area.y + rnd(i, 3) * area.h + Math.sin(t * (0.4 + rnd(i, 4) * 0.5) + i) * 3 - t * 0.8;
    let m = 0; for (const s of shafts) m = Math.max(m, inShaft(x, y, s.x, s.y, s.w));

  g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = color; g.beginPath(); g.rect(0, 0, W, H);
  for (const [x, y, w, h] of holes) g.rect(x + w, y, -w, h);

}
function glow(x, y, r, rgb, a) { if (a <= 0.005) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
function interior(d, t) {

  R(0, 0, W, 34, '#191311');
  for (let q = -240; q < 900; q += 48) { const x = Math.round(wl(q)); if (x > -4 && x < W) R(x, 0, 3, 34, '#211915'); }
  R(0, 34, W, 2, '#2e241f');
  const wins = [], tubes = [];
  for (let q = -342; q < 900; q += 120) {
    const x = Math.round(wl(q)); if (x > -60 && x < W + 10) { drawWindow(x, 5, 50, 22, sun); wins.push([x, 5, 50, 22]); }
    const tq = q + 64, tx = Math.round(wl(tq)), k = TUBE_Q.indexOf(tq), on = k >= 0 ? tubeOn(k, t) : 0;

      R(tx + 4, 0, 1, 13, '#3a332c'); R(tx + 41, 0, 1, 13, '#3a332c'); R(tx - 2, 13, 50, 2, '#3a332c'); R(tx, 15, 46, 3, on > 0.5 && !fl ? '#fff3c8' : '#5d5446');

  for (let q = -198; q < 900; q += 64) { const x = Math.round(wl(q)); if (x >= 0 && x < W) R(x, 36, 1, 132, '#2a211c'); }
  for (let q = -156; q < 900; q += 180) {
    const x0 = Math.round(wl(q)); if (x0 > W || x0 + 150 < 0) continue;
    R(x0, 44, 3, 124, '#41332a'); R(x0 + 147, 44, 3, 124, '#41332a');
    for (const y of [64, 100, 136]) {
      let x = x0 + 5, sd = q * 7 + y + 1000;
      while (x < x0 + 134) { const bw = 9 + Math.floor(rnd(sd, 3) * 12), bh = 8 + Math.floor(rnd(sd, 4) * 16), c = ['#5b4330', '#4f3a2a', '#66503a'][Math.floor(rnd(sd, 5) * 3)];
        R(x, y - bh, bw, bh, c); R(x, y - bh, bw, 1, '#76604a'); R(x + (bw >> 1), y - bh, 1, bh, '#6e5a42'); x += bw + 2 + Math.floor(rnd(sd, 6) * 5); sd++; }

  ['111', '001', '111', '001', '111'].forEach((row, y) => [...row].forEach((v, x) => { if (v === '1') R(sg + 10 + x * 2, 46 + y * 2, 2, 2, '#1d1815'); }));

  const st = lay(d, 1.0), sx0 = Math.round(st(-222));

    const sbx = (x, y) => { R(x, y, 15, 13, C.kraft); R(x, y, 15, 2, C.kraftTop); R(x + 13, y + 2, 2, 11, C.kraftDark); R(x + 6, y, 3, 13, C.tape); };
    sbx(sx0 + 1, 145); sbx(sx0 + 17, 145); sbx(sx0 + 1, 132); sbx(sx0 + 17, 132); sbx(sx0 + 9, 119);

}
function lineBelt(d, t, front) {
  const bl = lay(d, 1.0), run = beltRun(t), laser = t < S1.laserOff;
  if (!front) { for (const q of GATES) { const x = Math.round(bl(q)); if (x > -20 && x < W + 20) { R(x - 11, 108, 4, 40, '#555a5f'); R(x - 11, 105, 24, 5, C.metal); R(x - 2, 110, 6, 3, '#2b2e31'); } } return; }

    const k0 = Math.floor((BELT_END - run) / MARK), k1 = Math.ceil((W - HX + d - run) / MARK);
    for (let k = k0; k <= k1; k++) { const x = Math.round(bl(k * MARK + run)); if (x < x0 + 1 || x >= W) continue; const q = ((k % 4) + 4) % 4;
      if (q === 0) { R(x - 1, BELT_Y, 3, 4, '#a08a3c'); R(x - 1, BELT_Y, 3, 1, '#c9ad4c'); } else if (q === 2) R(x, BELT_Y, 1, 4, '#5a4d44'); else R(x, BELT_Y + 1, 1, 3, C.slat); }
    R(x0, BELT_Y + 4, W - x0, 12, C.face);
    for (let q = Math.floor((BELT_END - run % 14) / 14) * 14; q < W - HX + d + 14; q += 14) { const x = Math.round(bl(q + run % 14)); if (x >= x0 + 2 && x < W) { R(x, BELT_Y + 8, 8, 4, '#2b2422'); R(x + 2, BELT_Y + 9, 2, 2, '#4a403b'); } }
    R(x0, BELT_Y + 15, W - x0, 1, '#0c0a09');
    for (let q = BELT_END + 22; q < 1000; q += 80) { const x = Math.round(bl(q)); if (x > -4 && x < W) R(x, BELT_Y + 16, 4, 10, '#2b2422'); }

function haeun(cx, top, o = {}) {

    R(fx - 8, ft + 5, 16, 2, brim); R(fx - 8, ft + 5, 16, 1, cap); R(fx - 8, ft + 7, 16, 1, capD);
    R(fx - 5, ft + 8, 10, 2, '#3a2622'); R(fx - 5, ft + 10, 10, 1, '#8a5a44');

let tutEnd = null, tutDoneAt = null;

  if (tutEnd == null && (hits >= TUT.need || t > beatT(NBEAT))) { const k = Math.floor(tBeat(t) / 4) + 1; tutEnd = Math.min(beatT(NBEAT), beatT(k * 4)) + 0.2; }
  if (tutEnd != null && t > tutEnd + 1.6 && tutDoneAt == null) { tutDoneAt = t; HB.halt(); mode = 'end7'; $('tutres').textContent = `넷째 박 ${hits}번 · 딱 ${st.perfect} · 좋아 ${st.good} · 놓침 ${st.miss}`; $('end7').hidden = false; }

// ---------- sound: the line's own (motor, tubes, the gate's beep), steps, the voices' blips ----------
let ac = null, sfxOut, NB, amb = null;
