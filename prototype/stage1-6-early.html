[hidden]{display:none!important}
html,body{min-height:100%} body{box-sizing:border-box;margin:0}

  background:radial-gradient(ellipse at 50% 30%,rgba(255,233,168,.10),transparent 60%),rgba(8,6,5,.86)}
.cover .k{font:500 clamp(11px,1.6vw,13px) var(--mono);letter-spacing:.14em;color:var(--muted)}

.go:focus-visible,.btn:focus-visible{outline:3px solid #ffe9a8;outline-offset:3px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.help{margin:0;font-size:12.5px;color:var(--muted)} .help b{color:var(--ink)}
</style>
</head>

<script>

  laser:'#ff4a3d', ok:'#8fd694', belt:'#38302c', slat:'#2a2320', face:'#171312', metal:'#6a7075',

// ---------- the cast (the same pixels as the 1-6 cutscene: cutscene-1-6.html) ----------
function haeun(cx, top, o = {}) {

  // leg lifts and swings forward in an arc and sets down, the other stays planted; the next step it's the other leg's turn

  R(cx + 6 + sw, top + 14, 4, 18, hair); R(cx + 8 + sw, top + 16, 1, 12, hairL);
  // sky-blue tee with the white stripe over black sleeves, black bottoms
  R(cx - 7, top + 16, 14, 23, shirt); R(cx - 7, top + 15, 14, 16, sky); R(cx - 7, top + 27, 14, 2, tee); R(cx - 7, top + 30, 14, 9, shirtD);
  // the head, smaller than the rest of the cast (a 10x12 face under a 12-wide cap, chin where theirs is). Tipped down it sinks
  // two pixels into the collar and leans one forward.
  const fx = cx + hx, ft = top + hy;
  if (o.headFront) {

    // nose and mouth in the middle (no face line: that is her profile's edge)
    R(fx - 5, ft + 3, 10, 12, C.skin);
    R(fx - 6, ft, 12, 6, cap); R(fx - 5, ft - 1, 10, 1, cap); R(fx - 6, ft + 5, 12, 1, capD); R(fx - 1, ft - 2, 2, 1, capD); R(fx - 2, ft + 1, 4, 2, '#f4e6e0');

    R(fx - 5, ft + 8, 10, 2, '#3a2622'); R(fx - 5, ft + 10, 10, 1, '#8a5a44');

  } else {
    R(fx + 3, ft + 3, 4, 12, hair);   // the back of her head under the cap, running into the hair down her back
    R(fx - 5, ft + 3, 10, 12, C.skin);
    R(fx - 6, ft, 12, 6, cap); R(fx - 5, ft - 1, 10, 1, cap); R(fx - 6, ft + 5, 12, 1, capD); R(fx - 2, ft - 1, 1, 7, capD); R(fx - 1, ft - 2, 2, 1, capD);
    R(fx - 5, ft + 1, 3, 2, '#f4e6e0');

    R(fx - 9, ft + 4, 3, 2, brim); R(fx - 9, ft + 4, 3, 1, cap); R(fx - 9, ft + 6, 3, 1, capD);
    R(fx - 13, ft + 4 + tilt, 4, 2, brim); R(fx - 13, ft + 4 + tilt, 4, 1, cap); R(fx - 13, ft + 6 + tilt, 4, 1, capD);

  if (o.arms === 'belt') {

    const k = ease(o.strap || 0);

    const k = ease(o.watch || 0), hx = Math.round(lerp(cx - 8, cx - 4, k)), hy = Math.round(lerp(top + 31, top + 25, k));

  }

}
function jiwooFig(cx, top, o = {}) {

  g.save(); if (o.mirror) { g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); }
  const sw_ = o.stride ? Math.sin(Math.PI * o.stride.p) : 0, fwd = Math.round(3 * sw_), lift = Math.round(2 * sw_);
  const nx = o.stride && o.stride.leg === 0 ? -fwd : 0, ny = o.stride && o.stride.leg === 0 ? -lift : 0, fx_ = o.stride && o.stride.leg === 1 ? -fwd : 0, fy_ = o.stride && o.stride.leg === 1 ? -lift : 0;
  R(cx + 1 + fx_, top + 38, 5, 15 + fy_, jean); R(cx + 1 + fx_, top + 52 + fy_, 7, 3, shoe);
  R(cx - 5 + nx, top + 38, 5, 16 + ny, jean); R(cx - 7 + nx, top + 53 + ny, 7, 3, shoe);
  const arm = (sx, hx, hy) => { thick(sx, top + 18, hx, hy, 3, hood); R(hx - 1, hy - 1, 3, 3, skin); };
  const fl = o.flowers || JFLOWERS;
  if (!fl && o.arms !== 'reach' && o.arms !== 'strap') { if (o.arms === 'walk') arm(cx + 7, cx + 7 + Math.round(o.fF || 0), top + 31); else arm(cx + 7, cx + 7, top + 31); }   // the far arm
  R(cx - 7, top + 16, 14, 24, hood); R(cx - 7, top + 37, 14, 3, hoodD); R(cx - 3, top + 18, 1, 7, '#e8e4dc');
  R(cx - 9, top - 2, 18, 20, hood); R(cx - 9, top - 2, 18, 2, hoodD); R(cx + 5, top + 16, 4, 2, hoodD);
  R(cx - 6, top + 3 - up, 10, 12, skin); R(cx - 6, top + 3 - up, 10, 2 + down, '#1e1a1a');
  R(cx - 4, top + 8 + down - up, 2, down ? 1 : 2, ink); R(cx - 4, top + 12 + down - up, 2, 1, '#9a5a50');
  for (let k = 0; k < 7; k++) R(cx - 5 + (k % 2), top + 13 + k, 1, 1, '#f4f1ea');   // the earbud's wire
  // the flowers in front of him, the near hand on the cone (or the far one, while the near hand knocks or reaches)
  const flowers = (bx, by) => { for (let r = 0; r < 18; r++) { const w = Math.round(12 - r * 0.55); R(bx - Math.floor(w / 2), by + 4 + r, w, 1, r % 5 === 0 ? '#cbbd9e' : '#e8dcc4'); } R(bx - 3, by + 13, 6, 2, '#d8463b');
    for (const [dx, dy, c] of [[4, 0, '#4a8a3a'], [-5, 1, '#4a8a3a'], [3, -2, '#f2a6c8'], [-1, -4, '#e86a6a'], [-4, -2, '#ffd27a'], [0, 0, '#f8f4ec'], [-3, 1, '#f2a6c8'], [2, 2, '#ffd27a']]) R(bx + dx - 1, by + dy, 3, 3, c); };

function person(cx, top, p) {
  const ink = '#1b1716', shoe = '#1e1a1a', sleeve = p.top;
  g.save(); if (p.m) { g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); }
  if (p.pack) { R(cx + 5, top + 17, 6, 17, p.pack); R(cx + 5, top + 17, 6, 1, 'rgba(255,255,255,.15)'); }
  if (p.hair === 'long') R(cx + 1, top + 1, 7, 22, p.hc);

  if (p.seated) { R(cx - 7, top + 36, 14, 6, p.bot); R(cx - 5, top + 42, 4, 11, p.bot); R(cx + 1, top + 42, 4, 11, p.bot); R(cx - 6, top + 52, 6, 3, shoe); R(cx + 1, top + 52, 6, 3, shoe); }

  R(cx - 7, top + 16, 14, p.seated ? 21 : 23, p.top);

    if (p.hair === 'bun') R(fx + 3, ft - 4, 5, 5, hc);

  if (p.mask) { R(fx - 6, ft + 9, 9, 5, '#eef0f2'); R(fx + 3, ft + 9, 3, 1, '#d8dce0'); } else R(fx - 3, ft + 11, 2, 1, '#9a5a50');

  arm(cx + 8, cx + 8, top + (p.seated ? 30 : 31));

  else if (p.act === 'phone') { arm(cx - 8, cx - 4, top + 26); R(cx - 6, top + 22, 3, 5, '#1b1d1e'); R(cx - 6, top + 22, 3, 1, '#9fd0ff'); }
  else if (p.act === 'book') { arm(cx - 8, cx - 3, top + 28); R(cx - 9, top + 24, 9, 6, '#a8443a'); R(cx - 8, top + 25, 7, 4, '#f2eee2'); }
  else if (p.act === 'reach') arm(cx - 8, p.rx, p.ry);

// ---------- the song: 1-5's drill track (146 BPM, first downbeat at 0.483 s), from its bar 2, out of 지우's phone ----------
const BEAT = 60 / 146, BAR = BEAT * 4, LEAD = 0.483, FROM_BAR = 2, OFF = LEAD + FROM_BAR * BAR;
const T_SONG = 9.7;   // when the phone starts it (scene clock)
const barT = b => T_SONG + (b - FROM_BAR) * BAR;
const songBar = t => FROM_BAR + (t - T_SONG) / BAR;
const PLACE_X = 66, SCAN_X = 300, BELT_Y = 146, HTOP = 106, PLAYER_X = 340, TRAVEL = 4 * BEAT;
const BOX_V = (SCAN_X - PLACE_X) / TRAVEL;
// practice: bars 4 to 13, a box on beats 1 and 3. 지우 puts them down late at first (he is behind her beat), then less, then on it.

  if (t < 0.9) { g.fillStyle = `rgba(0,0,0,${1 - seg(t, 0, 0.9)})`; g.fillRect(0, 0, W, H); }

// ---------- words over the picture (drawn on the big canvas) ----------
const WHO = { j: { name: '지우', c: '#8a3a50' }, h: { name: '하은', c: '#c43d33' }, b: { name: '반장', c: '#c8601e' } };
const SAYS = [
  { at: () => IN.say1, dur: 2.6, who: 'j', text: '형. 좀 봐줘요. 누나 박자.' },
  { at: () => IN.say2, dur: 1.4, who: 'j', text: '…해 보자.' },
  { at: () => barT(5.3), dur: 2.0, who: 'j', text: '…아, 또 밀렸다.' },
  { at: () => barT(7.2), dur: 1.8, who: 'j', text: '조금만 더 빨리…' },
  { at: () => barT(10.3), dur: 1.9, who: 'j', text: '어? 맞는다…!' },
  { at: () => barT(12.2), dur: 1.9, who: 'j', text: '이거야, 이거.' },
  { at: () => barT(15.0), dur: 1.5, who: 'j', text: '누나, 어제…', cut: true },
  { at: () => pressT == null ? null : pressT + 0.8, dur: 2.6, who: 'b', text: '…하은이 오늘까지다.' },
  { at: () => pressT == null ? null : pressT + 4.2, dur: 2.2, who: 'j', text: '…저 때문이에요?' },
  { at: () => pressT == null ? null : pressT + 7.6, dur: 2.2, who: 'h', text: '아니야.' }

function headOf(who, s) { const p = s[who]; return p ? { x: p.x, y: (p.top ?? HTOP) - 4 } : null; }
function bubble(text, hx, hy, who, u, dur) {
  const a = Math.min(seg(u, 0, 0.12), 1 - seg(u, dur - 0.2, dur)); if (a <= 0) return;
  const chars = [...text], n = Math.min(chars.length, Math.floor(u / 0.04) + 1);

  out.font = '600 25px "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif';

  out.fillStyle = '#1d1815'; out.textBaseline = 'middle'; out.fillText(chars.slice(0, n).join(''), bx + 18, by + hgt / 2 + 1);
  out.font = '400 18px "Black Han Sans", sans-serif'; const nw = out.measureText(WHO[who].name).width + 16;
  out.fillStyle = WHO[who].c; out.fillRect(bx + 10, by - 13, nw, 24); out.fillStyle = '#fff'; out.fillText(WHO[who].name, bx + 18, by - 1);
  out.restore();
}
function overlay(t, s) {

  const fade = pressT != null ? 1 - seg(t - pressT, 11.2, 12.8) : 1;
  out.save(); out.globalAlpha = (0.12 + 0.88 * bl) * fade * seg(t, 0.4, 1.2);
  out.textBaseline = 'middle'; out.textAlign = 'center';
  out.font = '600 15px "IBM Plex Sans KR", sans-serif'; out.fillStyle = '#3a332c';
  '월화수목금토일'.split('').forEach((d, i) => out.fillText(d, (CELL(i).x + 3.5) * SC, 78.5 * SC));
  out.textAlign = 'left'; out.font = '600 14px "IBM Plex Sans KR", sans-serif';
  ['지우', '신입', '민재', '하은'].forEach((nm, r) => { out.fillStyle = r === 3 ? '#8a2a20' : '#3a332c'; out.fillText(nm, 131 * SC, (86.5 + r * 8) * SC); });
  out.restore();
  // lines
  for (const l of SAYS) { const at = l.at(); if (at == null || t < at || t > at + l.dur) continue; const hd = headOf(l.who, s); if (hd) bubble(l.text, hd.x, hd.y, l.who, t - at, l.dur); }
  // the judgement over the scanner
  if (judge && t - judge.t < 0.5) { const u = t - judge.t; out.save(); out.globalAlpha = 1 - seg(u, 0.25, 0.5);
    out.font = '400 30px "Black Han Sans", sans-serif'; out.textAlign = 'center'; out.fillStyle = judge.c; out.fillText(judge.w, SCAN_X * SC, (96 - u * 14) * SC); out.restore(); }
  // a hint while the practice starts
  const sb = songBar(t);
  if (sb > 2.6 && sb < 6) { out.save(); out.globalAlpha = Math.min(seg(sb, 2.6, 3.0), 1 - seg(sb, 5.5, 6)); hint('상자가 빨간 선에 닿을 때 · Space / J / 화면 누르기'); out.restore(); }
  // the 4th cell waits for the player

    const c = CELL(6), x = (c.x + 3.5) * SC, y = (c.y + 3.5) * SC, f = ((t - barT(PROMPT_B)) / BEAT) % 1, r = 22 + 10 * (1 - f);
    out.save(); out.strokeStyle = '#ffe9a8'; out.lineWidth = 3; out.globalAlpha = 0.5 + 0.5 * (1 - f); out.beginPath(); out.arc(x, y, r, 0, Math.PI * 2); out.stroke();

    out.save(); out.globalAlpha = seg(t, barT(PROMPT_B) + 0.6, barT(PROMPT_B) + 1.2); hint('넷째 칸 · 눌러서 긋기'); out.restore();
  }
}
function hint(text) {

  const w = out.measureText(text).width + 32; out.fillStyle = 'rgba(10,8,7,.72)'; out.fillRect(W * SC / 2 - w / 2, 14, w, 36);
  out.fillStyle = '#efe6d2'; out.fillText(text, W * SC / 2, 33); out.textAlign = 'left';
}

// ---------- input ----------
function press() {
  if (!running || ended) return;
  const t = T;
  if (pressT == null && t > barT(PROMPT_B) - 0.08) {
    pressT = t; lastPress = t; sfxNow('slam'); phoneLevel(0, 0.02); addPostEvents(); return;
  }
  if (t < barT(3.5) || t > barT(14.2)) return;
  lastPress = t;
  let best = null; for (const n of NOTES) if (!n.res && Math.abs(t - n.arr) < WIN && (!best || Math.abs(t - n.arr) < Math.abs(t - best.arr))) best = n;
  if (!best) { sfxNow('whiff'); return; }
  const e = Math.abs(t - best.arr); best.res = e < PERFECT ? 'perfect' : 'good'; best.at = t; lastHit = t;
  judge = { t, w: e < PERFECT ? '딱' : '좋아', c: e < PERFECT ? '#ffe9a8' : '#8fd694' };
  sfxNow('tock');
  if (!litBars.has(best.bar)) { litBars.add(best.bar); lightNext(t); }
}
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['Space', 'KeyJ', 'KeyF', 'KeyK', 'KeyD', 'Enter'].includes(e.code)) { if (running && !ended) { e.preventDefault(); press(); } }
});
$('stage').addEventListener('pointerdown', e => { if (e.target.closest('button')) return; if (running && !ended) { e.preventDefault(); press(); } });

// ---------- sound ----------
let ac = null, master, sfx, NB, songBuf = null, songSrc = null, chain = null, acT0 = 0, hum = null, fbNext = 0;
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  sfx = ac.createGain(); sfx.connect(master);
  NB = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // the tubes' hum and the room
  const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 100; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
  const hg = ac.createGain(); hg.gain.value = 0; o.connect(lp); lp.connect(hg); hg.connect(master); o.start(); hum = hg;
  const rs = ac.createBufferSource(); rs.buffer = NB; rs.loop = true; const rl = ac.createBiquadFilter(); rl.type = 'lowpass'; rl.frequency.value = 180; const rg = ac.createGain(); rg.gain.value = 0.05; rs.connect(rl); rl.connect(rg); rg.connect(master); rs.start();
}
async function loadSong() {
  try { const r = await fetch('audio/1-5-this-is-a-beat.mp3'); if (!r.ok) throw 0; songBuf = await ac.decodeAudioData(await r.arrayBuffer()); } catch (e) { songBuf = null; }
}
function makeChain() {
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.Q.value = 0.9;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.2;
  const pk = ac.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 1500; pk.Q.value = 1; pk.gain.value = 6;
  const gn = ac.createGain(); hp.connect(lp); lp.connect(pk); pk.connect(gn); gn.connect(master);
  chain = { hp, lp, pk, gn }; phoneLevel(0, 0, true);
}
// k 0: a tinny phone speaker; k 1: the track as it is
function phoneLevel(k, tc, now) {
  if (!chain) return; const at = now ? ac.currentTime : ac.currentTime;
  const set = (p, v) => tc > 0 ? p.setTargetAtTime(v, at, tc) : p.setValueAtTime(v, at);
  set(chain.hp.frequency, 700 * Math.pow(20 / 700, k)); set(chain.lp.frequency, 2600 * Math.pow(18000 / 2600, k));
  set(chain.pk.gain, 6 * (1 - k)); set(chain.gn.gain, 0.42 + 0.5 * k);
}
function songAt(when) {
  makeChain();
  if (songBuf) { songSrc = ac.createBufferSource(); songSrc.buffer = songBuf; songSrc.connect(chain.hp); songSrc.start(when, OFF); }
  else fbNext = 0;
}
function songStop(tc = 0.02) { if (chain) { chain.gn.gain.setTargetAtTime(0, ac.currentTime, tc); const c = chain; setTimeout(() => { try { c.gn.disconnect(); } catch (e) {} }, 600); }
  if (songSrc) { const s = songSrc; setTimeout(() => { try { s.stop(); } catch (e) {} }, 400); } songSrc = null; chain = null; }
// (if the recording can't be fetched: a plain drill-ish beat in its place)
function fallbackTick(until) {
  if (songBuf || !chain || pressT != null && T > pressT + 10.2) return;
  while (true) { const t = barT(FROM_BAR) + fbNext * BEAT / 2; if (t > until) break; const w = acT0 + t, i = fbNext++;
    const q = i % 8; if (q === 0 || q === 3 || q === 5) drum(w, 'kick'); if (q === 4) drum(w, 'snare'); drum(w, 'hat'); }
}
function drum(w, kind) {
  const dst = chain.hp;
  if (kind === 'kick') { const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.setValueAtTime(140, w); o.frequency.exponentialRampToValueAtTime(45, w + 0.18); gn.gain.setValueAtTime(0.9, w); gn.gain.exponentialRampToValueAtTime(0.001, w + 0.35); o.connect(gn); gn.connect(dst); o.start(w); o.stop(w + 0.4); }
  else { const s = ac.createBufferSource(); s.buffer = NB; const f = ac.createBiquadFilter(); f.type = kind === 'hat' ? 'highpass' : 'bandpass'; f.frequency.value = kind === 'hat' ? 7000 : 1800; const gn = ac.createGain(); const d = kind === 'hat' ? 0.04 : 0.16; gn.gain.setValueAtTime(kind === 'hat' ? 0.15 : 0.6, w); gn.gain.exponentialRampToValueAtTime(0.001, w + d); s.connect(f); f.connect(gn); gn.connect(dst); s.start(w, Math.random()); s.stop(w + d + 0.02); }
}
const thump = (w, f, amp, dec) => { const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.setValueAtTime(f * 1.6, w); o.frequency.exponentialRampToValueAtTime(f, w + 0.04); gn.gain.setValueAtTime(0.0001, w); gn.gain.exponentialRampToValueAtTime(amp, w + 0.006); gn.gain.exponentialRampToValueAtTime(0.0001, w + dec); o.connect(gn); gn.connect(sfx); o.start(w); o.stop(w + dec + 0.05); };
const noise = (w, dur, amp, type, f, q = 1) => { const s = ac.createBufferSource(); s.buffer = NB; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const gn = ac.createGain(); gn.gain.setValueAtTime(amp, w); gn.gain.exponentialRampToValueAtTime(0.0001, w + dur); s.connect(fl); fl.connect(gn); gn.connect(sfx); s.start(w, Math.random() * 1.5); s.stop(w + dur + 0.02); };
const tone = (w, type, f0, f1, amp, dur) => { const o = ac.createOscillator(), gn = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, w); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, w + dur); gn.gain.setValueAtTime(0.0001, w); gn.gain.exponentialRampToValueAtTime(amp, w + 0.005); gn.gain.exponentialRampToValueAtTime(0.0001, w + dur); o.connect(gn); gn.connect(sfx); o.start(w); o.stop(w + dur + 0.03); };
const FX = {
  door: w => { noise(w, 0.5, 0.12, 'bandpass', 600, 3); thump(w + 0.02, 110, 0.25, 0.12); },
  shut: w => { thump(w, 80, 0.5, 0.2); noise(w, 0.12, 0.2, 'lowpass', 900); },
  step: w => { thump(w, 70, 0.12, 0.08); noise(w, 0.05, 0.05, 'lowpass', 1200); },
  punch: w => { noise(w, 0.03, 0.5, 'highpass', 2400); thump(w + 0.01, 210, 0.35, 0.06); tone(w + 0.05, 'square', 1900, 1900, 0.04, 0.05); },
  clack: w => { noise(w, 0.04, 0.5, 'bandpass', 1800, 2); thump(w, 160, 0.35, 0.07); },
  flicker: w => { for (const d of [0, 0.105, 0.26, 0.37]) noise(w + d, 0.025, 0.18, 'highpass', 3000); tone(w, 'sawtooth', 120, 120, 0.03, 0.4); },
  tick: w => { noise(w, 0.03, 0.35, 'highpass', 2600); },
  place: w => { thump(w, 120, 0.22, 0.07); noise(w, 0.06, 0.08, 'lowpass', 900); },
  tock: w => { tone(w, 'sine', 820, 820, 0.45, 0.09); noise(w, 0.05, 0.25, 'bandpass', 1300, 2); noise(w, 0.07, 0.15, 'bandpass', 400, 2); },
  whiff: w => { noise(w, 0.05, 0.07, 'bandpass', 700, 1); },
  squeak: w => { const o = ac.createOscillator(), gn = ac.createGain(), lf = ac.createOscillator(), lg = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(2500, w); o.frequency.linearRampToValueAtTime(3300, w + 0.12);
    lf.frequency.value = 38; lg.gain.value = 160; lf.connect(lg); lg.connect(o.frequency); gn.gain.setValueAtTime(0.0001, w); gn.gain.exponentialRampToValueAtTime(0.07, w + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, w + 0.14);
    o.connect(gn); gn.connect(sfx); o.start(w); lf.start(w); o.stop(w + 0.16); lf.stop(w + 0.16); noise(w, 0.13, 0.05, 'bandpass', 4200, 3); },
  slam: w => { FX.squeak(w); thump(w + 0.02, 62, 0.9, 0.35); noise(w + 0.02, 0.12, 0.3, 'lowpass', 500); },
  blip: w => { for (const d of [0, 0.08, 0.16]) tone(w + d, 'square', 640, 640, 0.025, 0.04); },
  blipH: w => { for (const d of [0, 0.08, 0.16]) tone(w + d, 'square', 820, 820, 0.022, 0.04); },
  blipL: w => { for (const d of [0, 0.09, 0.18]) tone(w + d, 'square', 330, 330, 0.03, 0.05); },
  off: w => { songStop(0.01); noise(w, 0.02, 0.3, 'highpass', 3000); }
};
const EV = [];
function steps(a, b, per = 0.42) { for (let t = a + per * 0.6; t < b; t += per) EV.push({ t, fn: 'step' }); }
EV.push({ t: IN.door, fn: 'door' }, { t: IN.punch, fn: 'punch' }, { t: IN.shut, fn: 'shut' }, { t: IN.sw[0] + 0.3, fn: 'clack' }, { t: IN.phone[1] - 0.2, fn: 'tick' },
  { t: barT(14), fn: 'door' }, { t: barT(17.0), fn: 'shut' }, ...STROKES.map(b => ({ t: barT(b), fn: 'squeak' })), ...NOTES.map(n => ({ t: n.place, fn: 'place' })));
steps(...IN.walk); steps(...IN.walk2); steps(barT(14.4), barT(15.0)); steps(barT(15.7), barT(17.4), 0.38);
for (const l of SAYS) { const at = l.at(); if (at != null) EV.push({ t: at, fn: l.who === 'b' ? 'blipL' : l.who === 'h' ? 'blipH' : 'blip' }); }
function addPostEvents() {
  const P = pressT, post = [];
  for (const l of SAYS) { const at = l.at(); if (at != null && at > P) post.push({ t: at, fn: l.who === 'b' ? 'blipL' : l.who === 'h' ? 'blipH' : 'blip' }); }
  // the tubes go off from the far end, all but the one over the door
  TUBES.filter(x => x !== 24 && tubeOn[x] != null).sort((a, b) => b - a).forEach((x, k) => { tubeOff[x] = P + 2.4 + k * 0.32; post.push({ t: tubeOff[x], fn: 'clack' }); });
  post.push({ t: P + 7.1, fn: 'punch' }, { t: P + 10.2, fn: 'off' });
  for (const e of post) { e.post = true; EV.push(e); }
}
function audioTick() {
  if (!ac) return;
  const now = ac.currentTime - acT0;
  for (const e of EV) if (!e.done && e.t < now + 0.12 && e.t > now - 0.25) { e.done = true; const w = Math.max(ac.currentTime, acT0 + e.t); FX[e.fn](w); }
  fallbackTick(now + 0.3);
  const lit = TUBES.reduce((s, x) => s + tubeI(x, now), 0);
  hum.gain.setTargetAtTime(0.004 * lit, ac.currentTime, 0.05);
}

// ---------- the loop ----------
let raf = 0;
function frame() {
  if (!running) return;
  T = ac ? ac.currentTime - acT0 : T + 1 / 60;
  // the tube over 지우 comes on with his switch; the one over the door with the door
  if (tubeOn[80] == null && T > IN.tube) { tubeOn[80] = IN.tube; sfxNow('flicker'); }
  if (tubeOn[24] == null && T > barT(14) + 0.15) { tubeOn[24] = barT(14) + 0.15; sfxNow('flicker'); }
  // 반장 comes in and puts the rest of the line's lights on (whatever the player didn't light), so the rota is seen
  if (!bossLit && T > barT(15.65)) { bossLit = true; LIGHT_ORDER.filter(x => tubeOn[x] == null).forEach((x, k) => { tubeOn[x] = barT(15.65) + 0.1 + k * 0.09; }); sfxNow('clack'); }
  for (const n of NOTES) if (!n.res && T > n.arr + WIN) n.res = 'miss';
  audioTick();
  render(T);
  if (pressT != null && T > pressT + 12.9 && !ended) finish();
  raf = requestAnimationFrame(frame);
}
function sfxNow(fn) { if (ac) FX[fn](ac.currentTime); }
function finish() {
  ended = true; const hits = NOTES.filter(n => n.res && n.res !== 'miss').length;
  $('tally').textContent = `연습 상자 ${hits} / ${NOTES.length} · 켠 등 ${lights} / 6`;
  $('endcard').hidden = false;
}
async function begin() {
  $('title').hidden = true; $('endcard').hidden = true;
  if (!ac) { initAudio(); await loadSong(); }
  if (ac.state === 'suspended') await ac.resume();
  cancelAnimationFrame(raf); songStop(0.005); resetState();
  acT0 = ac.currentTime + 0.05; songAt(acT0 + T_SONG); running = true; frame();
}
$('start').addEventListener('click', async e => { e.stopPropagation(); e.currentTarget.textContent = '불러오는 중…'; await begin(); });
$('again').addEventListener('click', e => { e.stopPropagation(); begin(); });
$('restart').addEventListener('click', () => { if (ac) begin(); });
// the still behind the title
render(barT(11.3));
// (a debugging hook for the screenshots)
window.__early = { jump: t => { if (!ac) return; acT0 = ac.currentTime - t; }, state: () => ({ T, pressT, lights, hits: NOTES.filter(n => n.res && n.res !== 'miss').length }), press, NOTES, barT };
})();
</script>
