<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>신입 · 스캔 동작</title>
  <style>
    :root { color-scheme: dark; --bg: #121815; --panel: #1a221d; --line: #354139; --ink: #eff0df; --muted: #a2aea1; --accent: #d5eb7c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { width: min(100% - 48px, 1000px); margin: 42px auto 30px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .15em; margin: 0 0 8px; }
    h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.25; letter-spacing: -.06em; margin: 0; font-weight: 650; }
    .intro { margin: 8px 0 0; color: var(--muted); }
    .version { white-space: nowrap; color: var(--muted); font: 11px/1.5 ui-monospace, monospace; letter-spacing: .06em; padding-bottom: 3px; }
    .stage { position: relative; margin: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 14px 14px 0 0; background: #1b2820; }
    canvas { display: block; width: 100%; height: auto; }
    .stage-caption { position: absolute; top: 22px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
    .stage-caption span { color: #b5c1b0; font-size: 10px; letter-spacing: .12em; }
    .status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #81917c; }
    .status[data-active="true"] .dot { background: var(--accent); box-shadow: 0 0 12px #d5eb7c66; }
    .loading { position: absolute; inset: 0; display: grid; place-content: center; color: var(--muted); background: #1b2820; padding: 24px; text-align: center; }
    .loading[hidden] { display: none; }
    .panel { padding: 20px 24px; background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 14px 14px; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    button, select { font: inherit; border-radius: 7px; min-height: 39px; }
    button { cursor: pointer; border: 1px solid #485443; color: var(--ink); background: #263027; padding: 8px 15px; }
    button:hover { background: #354233; }
    button.primary { background: var(--accent); color: #202818; border-color: var(--accent); font-weight: 750; }
    button.primary:hover { background: #e2f59e; }
    button:disabled, select:disabled, input:disabled { cursor: wait; opacity: .5; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    kbd { font: 10px/1 ui-monospace, monospace; margin-left: 8px; opacity: .65; border: 1px solid currentColor; border-radius: 3px; padding: 2px 4px; }
    label.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 39px; padding: 0 4px; color: #c5cec0; font-size: 13px; }
    input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0 2px 0 0; }
    .speed { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: 12px; }
    select { color: var(--ink); background: #263027; border: 1px solid #485443; padding: 7px 30px 7px 10px; }
    .timeline { display: grid; grid-template-columns: 1fr 75px; align-items: center; gap: 18px; margin-top: 20px; }
    input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; height: 15px; }
    output { text-align: right; color: var(--muted); font: 11px/1 ui-monospace, monospace; }
    .timeline-labels { display: flex; justify-content: space-between; color: #7e8d7d; font-size: 10px; margin: 3px 93px 0 1px; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 24px; margin-top: 16px; color: #899685; font-size: 12px; }
    footer p { margin: 0; }
    @media (max-width: 640px) {
      main { width: min(100% - 24px, 1000px); margin: 24px auto; }
      header { margin-bottom: 18px; } .version { display: none; }
      .intro { font-size: 12px; } .panel { padding: 16px; }
      .stage-caption { top: 14px; left: 16px; right: 16px; }
      .stage-caption span { font-size: 8px; }
      .controls { gap: 8px; } .speed { margin-left: 0; }
      button { padding-inline: 12px; } kbd { display: none; }
      label.toggle { font-size: 12px; } footer { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">ROOKIE / MOTION STUDY</p>
        <h1>신입 · 스캔 동작</h1>
        <p class="intro">손을 뻗고, 스캔하고, 제자리로.</p>
      </div>
      <span class="version">01 — SCAN CYCLE</span>
    </header>
    <figure class="stage" aria-label="신입 캐릭터의 전신 스캔 동작 미리보기">
      <canvas id="rookie-canvas" width="1000" height="620" aria-label="상자를 향해 스캐너를 뻗는 신입 캐릭터">신입 캐릭터가 컨베이어의 상자를 스캔하는 동작입니다.</canvas>
      <figcaption class="stage-caption">
        <span>물류센터 · 1번 라인</span>
        <div class="status" id="status" data-active="false"><i class="dot" aria-hidden="true"></i><b id="phase">대기</b></div>
      </figcaption>
      <div class="loading" id="loading" role="status">캐릭터를 불러오는 중…</div>
    </figure>
    <section class="panel" aria-label="동작 재생 제어">
      <div class="controls">
        <button class="primary" id="scan" type="button" disabled>스캔<kbd>SPACE</kbd></button>
        <button id="pause" type="button" disabled>일시정지</button>
        <label class="toggle"><input id="repeat" type="checkbox" checked disabled>자동 반복</label>
        <label class="toggle"><input id="skeleton" type="checkbox" disabled>관절 보기</label>
        <label class="speed" for="speed">속도 <select id="speed" disabled><option value="1">보통 · 1×</option><option value="0.25">느리게 · 0.25×</option></select></label>
      </div>
      <div class="timeline">
        <input id="timeline" type="range" min="0" max="1400" step="1" value="0" aria-label="스캔 동작 시점" disabled>
        <output id="time" for="timeline">0.00초</output>
      </div>
      <div class="timeline-labels" aria-hidden="true"><span>대기</span><span>뻗기 · 스캔</span><span>복귀</span><span>대기</span></div>
    </section>
    <footer><p>Space로 스캔 · 타임라인을 움직여 자세 확인</p><p>원화 기반 전신 애니메이션</p></footer>
  </main>
  <script src="../rookie-rig.js"></script>
  <script src="../rookie-art.js"></script>
  <script>
  (() => {
    'use strict';
    const CYCLE_MS = 1400, SCAN_AT_MS = 180;
    const canvas = document.getElementById('rookie-canvas');
    const ctx = canvas.getContext('2d');
    const ui = Object.fromEntries(['scan', 'pause', 'repeat', 'skeleton', 'speed', 'timeline', 'time', 'phase', 'status', 'loading'].map(id => [id, document.getElementById(id)]));
    let motion, elapsed = 0, playing = false, loaded = false, previousTime = null, request = 0;
    let cycleStart = 0, lastTriggerAt = -Infinity, nextTriggerAt = SCAN_AT_MS, lastFrame = null;
    const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
    const wrap = value => ((value % CYCLE_MS) + CYCLE_MS) % CYCLE_MS;
    const rect = (x, y, w, h, fill) => { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); };

    function background() {
      const gradient = ctx.createLinearGradient(0, 0, 1000, 620);
      gradient.addColorStop(0, '#213126'); gradient.addColorStop(1, '#18241d');
      rect(0, 0, 1000, 620, gradient);
      ctx.strokeStyle = '#53634a16'; ctx.lineWidth = 1;
      for (let x = 40; x < 1000; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 620); ctx.stroke(); }
      for (let y = 50; y < 620; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1000, y); ctx.stroke(); }
      rect(0, 534, 1000, 86, '#142019'); rect(0, 534, 1000, 1, '#41513a');
      ctx.fillStyle = '#0a100c66'; ctx.beginPath(); ctx.ellipse(656, 540, 97, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.font = '10px system-ui, sans-serif'; ctx.fillStyle = '#657760';
      ctx.fillText('SCAN STATION', 78, 587);
      ctx.textAlign = 'right'; ctx.fillText('ROOKIE — 01', 922, 587); ctx.textAlign = 'left';
    }

    function belt() {
      // The belt ends beside the character so the full silhouette remains visible.
      rect(58, 134, 80, 4, '#526356'); rect(58, 138, 80, 10, '#324238');
      rect(58, 138, 80, 1, '#71816b'); rect(58, 147, 80, 2, '#1d2a21');
      for (let x = 61; x < 137; x += 8) {
        ctx.fillStyle = '#243229'; ctx.beginPath(); ctx.arc(x, 142.5, 2, 0, Math.PI * 2); ctx.fill();
        rect(x - .4, 141.6, .8, 1.8, '#73826c');
      }
      rect(68, 149, 3, 21, '#3f5140'); rect(124, 149, 3, 21, '#3f5140');
      rect(65, 169, 9, 1.2, '#64735c'); rect(121, 169, 9, 1.2, '#64735c');
      rect(76, 153, 36, 1, '#293c2b');
    }

    function carton(pulse) {
      rect(110, 109, 24, 25, '#bc8c58'); rect(111, 110, 19, 23, '#c99b63');
      rect(130, 110, 4, 24, '#9c7047'); rect(110, 109, 24, 1.1, '#ddbb85');
      rect(119, 110, 3, 7, '#dec28e'); rect(119, 109, 3, 1, '#ebd4a7');
      rect(123, 118, 9, 8, '#e6ddbe');
      const bars = [0, 1.1, 1.7, 2.9, 4.2, 4.8, 6];
      for (const bar of bars) rect(124 + bar, 119.4, bar === 2.9 ? .7 : .35, 4.5, '#3c4735');
      rect(113, 128, 4, .6, '#89663e'); rect(113, 129.6, 6, .6, '#89663e');
      if (pulse > .01) {
        ctx.save(); ctx.globalAlpha = pulse * .75;
        rect(123, 121.2, 9, .5, '#e9ffba'); ctx.restore();
      }
    }

    function drawSkeleton(pose) {
      const points = [pose.shoulder, pose.elbow, pose.wrist];
      ctx.save(); ctx.strokeStyle = '#ecfaac'; ctx.fillStyle = '#213126'; ctx.lineWidth = .45;
      ctx.setLineDash([1, .65]); ctx.beginPath();
      points.forEach((point, i) => i ? ctx.lineTo(point.x, point.y) : ctx.moveTo(point.x, point.y)); ctx.stroke();
      ctx.setLineDash([]);
      for (const point of points) { ctx.beginPath(); ctx.arc(point.x, point.y, .9, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      ctx.restore();
    }

    function paint(options = {}) {
      if (!loaded) return null;
      const repeat = options.repeat === undefined ? ui.repeat.checked : options.repeat;
      const localTime = repeat ? wrap(elapsed - cycleStart) : clamp(elapsed - cycleStart, 0, CYCLE_MS);
      const sample = motion.sample(elapsed);
      ctx.setTransform(1, 0, 0, 1, 0, 0); background();
      ctx.save(); ctx.setTransform(5, 0, 0, 5, -200, -315); ctx.imageSmoothingEnabled = false;
      belt(); carton(sample.pulse);
      RookieArt.drawBody(ctx, 175, 94, 0, 1e9);
      const pose = RookieArt.rigPose(175, 94, 1e9, sample);
      if (sample.pulse > .01) {
        ctx.save(); ctx.globalAlpha = sample.pulse * .7;
        ctx.strokeStyle = '#e2f6a2'; ctx.lineWidth = .22;
        ctx.beginPath(); ctx.moveTo(pose.muzzle.x, pose.muzzle.y); ctx.lineTo(131.8, 121.5); ctx.stroke();
        ctx.restore();
      }
      RookieArt.drawMainArm(ctx, 175, 94, 0, 1e9, sample);
      if (options.skeleton === undefined ? ui.skeleton.checked : options.skeleton) drawSkeleton(pose);
      ctx.restore();
      const phase = sample.pulse > .05 ? '스캔' : sample.reach > .025 ? (elapsed - lastTriggerAt >= 115 ? '복귀' : '뻗기') : '대기';
      ui.phase.textContent = phase; ui.status.dataset.active = String(sample.pulse > .05);
      ui.timeline.value = Math.round(localTime); ui.time.textContent = (localTime / 1000).toFixed(2) + '초';
      lastFrame = { timeMs: localTime, nowMs: elapsed, cycleMs: CYCLE_MS, phase, sample, pose };
      return lastFrame;
    }

    // Seeking establishes a fresh cycle; live painting never resets the controller.
    function seek(timeMs, repeat) {
      elapsed = repeat ? wrap(timeMs) : clamp(timeMs, 0, CYCLE_MS);
      cycleStart = 0; lastTriggerAt = -Infinity; nextTriggerAt = SCAN_AT_MS;
      motion.reset();
      if (elapsed >= SCAN_AT_MS) {
        motion.trigger(SCAN_AT_MS); lastTriggerAt = SCAN_AT_MS;
        nextTriggerAt += CYCLE_MS;
      }
    }

    function pause() {
      playing = false; previousTime = null; cancelAnimationFrame(request); request = 0;
      ui.pause.textContent = '재생'; ui.pause.setAttribute('aria-label', '동작 재생');
    }

    function frame(now) {
      if (!playing) return;
      if (previousTime !== null) elapsed += Math.min(now - previousTime, 100) * Number(ui.speed.value);
      previousTime = now;
      const finished = !ui.repeat.checked && elapsed >= cycleStart + CYCLE_MS;
      if (finished) elapsed = cycleStart + CYCLE_MS;
      while (elapsed >= nextTriggerAt) {
        motion.trigger(nextTriggerAt); lastTriggerAt = nextTriggerAt;
        cycleStart = nextTriggerAt - SCAN_AT_MS; nextTriggerAt += CYCLE_MS;
      }
      paint();
      if (finished) { pause(); return; }
      request = requestAnimationFrame(frame);
    }

    function play() {
      if (!loaded || playing) return;
      if (!ui.repeat.checked && elapsed >= cycleStart + CYCLE_MS) seek(0, false);
      playing = true; previousTime = null; ui.pause.textContent = '일시정지'; ui.pause.setAttribute('aria-label', '동작 일시정지');
      request = requestAnimationFrame(frame);
    }

    function scan() {
      if (!loaded) return;
      motion.trigger(elapsed); lastTriggerAt = elapsed;
      cycleStart = elapsed - SCAN_AT_MS; nextTriggerAt = elapsed + CYCLE_MS;
      const result = paint(); play(); return result;
    }

    ui.scan.addEventListener('click', scan);
    ui.pause.addEventListener('click', () => playing ? pause() : play());
    ui.timeline.addEventListener('input', () => { pause(); seek(Number(ui.timeline.value), false); paint({ repeat: false }); });
    ui.repeat.addEventListener('change', () => {
      cycleStart += Math.floor((elapsed - cycleStart) / CYCLE_MS) * CYCLE_MS;
      paint();
    });
    ui.skeleton.addEventListener('change', () => paint());
    document.addEventListener('keydown', event => {
      if (event.code !== 'Space' || event.repeat || /^(INPUT|BUTTON|SELECT|TEXTAREA)$/.test(event.target.tagName)) return;
      event.preventDefault(); scan();
    });

    // Export: await rookiePreview.ready; rookiePreview.render(ms, { repeat: true, skeleton: false }).
    // render() stops RAF, samples absolute milliseconds in the 1400 ms cycle, and returns the pose.
    const api = window.rookiePreview = {
      canvas, cycleMs: CYCLE_MS, scanAtMs: SCAN_AT_MS, pause, play, scan,
      snapshot: () => lastFrame,
      render(timeMs = 0, options = {}) {
        if (!Number.isFinite(timeMs)) throw new TypeError('timeMs must be finite');
        pause();
        if (!loaded) return null;
        const settings = { repeat: true, ...options };
        seek(Math.max(0, timeMs), settings.repeat);
        return paint(settings);
      }
    };
    api.ready = (async () => {
      if (!window.RookieRig || !window.RookieArt) throw new Error('애니메이션 파일을 불러오지 못했습니다.');
      await RookieArt.ready;
      motion = RookieRig.createMotion(); loaded = true;
      for (const control of [ui.scan, ui.pause, ui.repeat, ui.skeleton, ui.speed, ui.timeline]) control.disabled = false;
      ui.loading.hidden = true; paint();
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) pause(); else play();
      return api;
    })();
    api.ready.catch(error => { pause(); ui.loading.textContent = '미리보기를 불러올 수 없습니다. ' + error.message; console.error(error); });
  })();
  </script>
</body>
</html>
