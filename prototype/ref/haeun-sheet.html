<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하은 디자인 시트</title>
<style>
:root{--bg:#1b1716;--ink:#efe6d2;--muted:#b8a998;--card:#241f1d;--accent:#cfe04a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1716}}
:root[data-theme="dark"]{--bg:#1b1716}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 14px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;max-width:760px}
.card{background:var(--card);border-radius:10px;padding:12px}
.card h2{font-size:15px;margin:0 0 2px}
.card small{color:var(--muted);display:block;margin-bottom:8px}
canvas{display:block;width:100%;image-rendering:pixelated;background:#2a211c;border-radius:6px}
.tag{display:inline-block;background:var(--accent);color:#1b1716;font-weight:700;border-radius:4px;padding:0 6px;font-size:12px;margin-right:4px}
</style>
</head>
<body>
<h1>하은 디자인 시트 (3차: 작은 눈 + 모자)</h1>
<p>눈은 다른 인물들처럼 검은 점 두 개(홍채·하이라이트 없음). 같은 동글 단발에 모자 세 가지. 네 표정(기본 · 깜빡 · 스캔 성공 · 시계). 가장 오른쪽은 게임 안 크기(3배).</p>
<div class="row" id="rows"></div>
<script>
const C = { skin:'#f6d2b5', skinDark:'#e0b393', ink:'#2a2024', vest:'#cfe04a', reflect:'#ebe5c9', cheek:'#f7a3ad', mouth:'#c0606a', hi:'#ffffff', iris:'#4a3340', irisL:'#7a5a66' };
function px(g, s) { return (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x * s), Math.round(y * s), Math.round(w * s), Math.round(h * s)); }; }
// a rounded block: corners knocked off two deep
function blob(R, x, y, w, h, c) { R(x + 2, y, w - 4, h, c); R(x + 1, y + 1, w - 2, h - 2, c); R(x, y + 2, w, h - 4, c); }
// eyes like the rest of the cast: small black dots low on the face, no iris, no highlight
function eyes(R, cx, y, mode) {
  for (const ex of [cx - 5, cx + 3]) {
    if (mode === 'blink') { R(ex, y + 1, 2, 1, C.ink); continue; }
    if (mode === 'happy') { R(ex - 1, y + 1, 1, 1, C.ink); R(ex, y, 2, 1, C.ink); R(ex + 2, y + 1, 1, 1, C.ink); continue; }
    if (mode === 'watch') { R(ex, y + 2, 2, 2, C.ink); continue; }
    R(ex, y, 2, 2, C.ink);
  }
}
function face(R, cx, top, mode) {
  eyes(R, cx, top + 10, mode);
  R(cx - 8, top + 13, 2, 1, C.cheek); R(cx + 6, top + 13, 2, 1, C.cheek);   // blush beside the eyes
  if (mode === 'happy') { R(cx - 1, top + 15, 1, 1, C.mouth); R(cx, top + 16, 2, 1, C.mouth); R(cx + 2, top + 15, 1, 1, C.mouth); }
  else R(cx, top + 16, 2, 1, C.mouth);
}
// a small body under a big head: 12 wide, mitten hands, short legs
function body(R, cx, top, topCol, legCol, mode) {
  R(cx - 6, top, 12, 15, topCol); R(cx - 6, top + 2, 12, 9, C.vest); R(cx - 6, top + 6, 12, 2, C.reflect);
  R(cx - 5, top + 15, 4, 6, legCol); R(cx + 1, top + 15, 4, 6, legCol);
  R(cx - 6, top + 20, 5, 2, '#1e1a1a'); R(cx + 1, top + 20, 5, 2, '#1e1a1a');
  if (mode === 'watch') { R(cx + 4, top + 3, 3, 5, topCol); R(cx + 1, top + 7, 5, 3, topCol); R(cx + 2, top + 6, 3, 2, '#e2e8ec'); R(cx + 3, top + 6, 1, 1, C.ink); R(cx - 9, top + 3, 3, 3, C.skin); }
  else { R(cx + 5, top + 4, 8, 3, topCol); R(cx + 12, top + 3, 3, 3, C.skin); R(cx + 14, top + 1, 8, 4, '#2d2f33'); R(cx + 15, top + 5, 2, 4, '#2d2f33'); R(cx + 22, top + 2, 2, 2, '#ff4a3d'); R(cx - 9, top + 5, 3, 3, C.skin); }
}
// the same round bob under three hats
function bob(R, cx, top, hair, hairD) {
  blob(R, cx - 13, top - 2, 26, 22, hair); R(cx - 13, top + 17, 4, 5, hairD); R(cx + 9, top + 17, 4, 5, hairD);
  blob(R, cx - 11, top + 1, 22, 20, C.skin);
  R(cx - 11, top + 1, 22, 4, hair); R(cx - 11, top + 5, 4, 3, hair); R(cx - 5, top + 5, 3, 2, hair); R(cx + 1, top + 5, 4, 2, hair); R(cx + 7, top + 5, 4, 3, hair);
  R(cx - 12, top + 4, 2, 12, hair); R(cx + 10, top + 4, 2, 12, hair);
}
// A. 버킷햇: 차콜, 챙이 아래로, 작은 라벨
function drawA(R, cx, top, mode) {
  const hair = '#4a3328', hairD = '#372417', top2 = '#e6edf3', hat = '#3a3d45', hatD = '#24262c';
  body(R, cx, top + 20, top2, '#2f3338', mode);
  bob(R, cx, top, hair, hairD);
  blob(R, cx - 11, top - 6, 22, 10, hat); R(cx - 14, top + 2, 28, 2, hat); R(cx - 15, top + 3, 30, 2, hatD); R(cx - 11, top + 1, 22, 1, hatD);
  R(cx + 5, top - 1, 4, 2, '#e9e4da'); R(cx + 6, top - 1, 2, 1, '#d8463b');   // label
  face(R, cx, top + 1, mode);
}
// B. 스냅백 앞으로: 납작한 챙, 투톤, 정면 로고
function drawB(R, cx, top, mode) {
  const hair = '#4a3328', hairD = '#372417', top2 = '#e6edf3', cap = '#1f6f6b', capD = '#154f4c', brim = '#cfe04a';
  body(R, cx, top + 20, top2, '#2f3338', mode);
  bob(R, cx, top, hair, hairD);
  blob(R, cx - 12, top - 6, 24, 9, cap); R(cx - 12, top + 1, 24, 2, capD);
  R(cx + 6, top + 1, 15, 2, brim); R(cx + 6, top + 3, 15, 1, '#9fb030');   // flat brim forward (she faces right)
  R(cx - 3, top - 3, 5, 3, '#ffffff'); R(cx - 2, top - 2, 3, 1, cap);   // logo
  face(R, cx, top + 1, mode);
}
// C. 슬라우치 비니: 뒤로 길게 늘어지고 접힌 단, 방울 없음
function drawC(R, cx, top, mode) {
  const hair = '#4a3328', hairD = '#372417', top2 = '#ffe3ea', beanie = '#d8463b', beanieD = '#a83328';
  body(R, cx, top + 20, top2, '#3a3f45', mode);
  bob(R, cx, top, hair, hairD);
  blob(R, cx - 12, top - 9, 24, 13, beanie); blob(R, cx - 19, top - 7, 12, 10, beanie); R(cx - 19, top - 1, 6, 2, beanieD);   // slouch hanging back-left
  R(cx - 12, top + 1, 24, 3, beanieD); R(cx - 12, top + 3, 24, 1, beanie);   // folded cuff
  face(R, cx, top + 1, mode);
}
const variants = [
  ['A', '버킷햇', '차콜 버킷햇, 챙이 눈썹까지. 작은 라벨 하나. 동글 단발.', drawA],
  ['B', '스냅백', '청록 스냅백을 앞으로, 납작한 연두 챙(벨트 색), 흰 로고. 동글 단발.', drawB],
  ['C', '슬라우치 비니', '빨간 비니를 뒤로 길게, 접힌 단. 방울 없음. 동글 단발.', drawC]
];
const modes = [['idle', '기본'], ['blink', '깜빡'], ['happy', '스캔 성공'], ['watch', '시계']];
const rows = document.getElementById('rows');
for (const [key, name, desc, fn] of variants) {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h2><span class="tag">${key}</span>${name}</h2><small>${desc}</small>`;
  const cv = document.createElement('canvas'); const S = 7, cellW = 50, H = 62;
  cv.width = (cellW * 4 + 30) * S; cv.height = H * S;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; const R = px(g, S);
  modes.forEach(([m, label], i) => { fn(R, 24 + i * cellW, 12, m); g.fillStyle = '#b8a998'; g.font = `${2.4 * S}px system-ui`; g.fillText(label, (12 + i * cellW) * S, (H - 3) * S); });
  const R3 = px(g, 3); fn(R3, Math.round((cellW * 4 + 14) * S / 3), Math.round(14 * S / 3), 'idle'); g.fillStyle = '#b8a998'; g.fillText('게임 크기', (cellW * 4 + 4) * S, (H - 3) * S);
  card.appendChild(cv); rows.appendChild(card);
}
</script>
</body>
</html>
